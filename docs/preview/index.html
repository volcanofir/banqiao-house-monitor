<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="板橋新案監控 Preview" />
<link rel="apple-touch-icon" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211301" />
<link rel="icon" type="image/png" sizes="32x32" href="/banqiao-house-monitor/icon-safe-32.png?v=202608211301" />
<link rel="shortcut icon" href="/banqiao-house-monitor/favicon.ico?v=202608211301" />
<meta name="theme-color" content="#f5d331" />
<title>Banqiao House Monitor Preview</title>
<style>
:root{--cream:#fff8df;--paper:#fffef8;--yellow:#f5d331;--green:#124b37;--red:#cf3f4a;--ink:#30312f;--muted:#756f64;--line:#e3ca73;--gray:#515861}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}a{color:inherit}
.preview-banner{position:sticky;top:0;z-index:20;background:#1f2937;color:#fff;padding:10px 16px;text-align:center;font-size:14px;font-weight:900}.top{position:sticky;top:39px;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:15px;text-align:center;font-weight:900}
main{width:min(1180px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.hero{background:var(--yellow);border-radius:28px;padding:28px}.hero h1{color:var(--green);font-size:clamp(34px,7vw,56px);margin:8px 0 12px}.hero p{color:#315244;line-height:1.8}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:#936d00}
.metrics,.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.metric,.compare-card{background:#fffef8;border:1px solid #dcc875;border-radius:20px;padding:16px}.metric span,.compare-card span{display:block;color:var(--muted);font-size:13px;font-weight:800}.metric strong,.compare-card strong{display:block;color:var(--green);font-size:27px;margin-top:5px}.compare-card.review strong{color:#8a6500}.compare-card.missing strong{color:#a52d39}.compare-card.unavailable strong{color:#62686e}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin-top:18px}.stripe{height:7px;background:linear-gradient(90deg,var(--red) 0 66%,var(--gray) 66%)}.inside{padding:22px}.inside h2{margin:5px 0 16px}.note{font-size:13px;color:var(--muted);line-height:1.75;margin:12px 0}.company-note{background:#fff5ce;border:1px solid #e6cc72;border-radius:14px;padding:12px 14px;color:#66571f;font-size:13px;line-height:1.75}
.source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.source-card{background:var(--cream);border:1px solid #ead58b;border-radius:17px;padding:15px}.source-head{display:flex;justify-content:space-between;gap:8px}.source-head strong{color:var(--green)}.badge,.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}.ok{background:#dcefe7;color:#14503c}.stale{background:#fff0bd;color:#8a6500}.err{background:#f7dadd;color:#972a35}
.tools{display:grid;grid-template-columns:160px 170px 180px minmax(190px,1fr);gap:8px;margin:14px 0}.tools select{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:inherit}
.road-group{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff;margin:10px 0}.road-group>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px;background:#fff4c8;color:var(--green);font-weight:900}.road-group>summary::-webkit-details-marker{display:none}.count{background:var(--green);color:#fff;border-radius:999px;padding:4px 9px;font-size:12px}.list{padding:0 14px}.item{padding:15px 0;border-bottom:1px solid #f0e5bd}.item:last-child{border-bottom:0}.item-title{font-weight:900;color:var(--green);text-decoration:none;line-height:1.5}.row{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:8px;color:#645e54;font-size:13px;align-items:center}.pill{background:#eee9df;color:#625a4d}.pill.sinyi{background:#dcefe7;color:#14503c}.pill.m591{background:#e8eef9;color:#35577d}.pill.stock{background:#124b37;color:#fff}.pill.review{background:#fff0bd;color:#755600;border:1px solid #e3ca73}.pill.missing{background:#f7dadd;color:#972a35}.pill.unavailable{background:#e9ecef;color:#5d6268}.pill.merged{background:#fff3b0;color:#755600;border:1px solid #dfc25f}.pill.primary{background:#124b37;color:#fff}.candidate{font-size:12px;color:#756f64}.merge-details{margin-top:11px;border:1px dashed #d8bd61;border-radius:13px;background:#fffaf0;overflow:hidden}.merge-details>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:13px;font-weight:900;color:#755600}.merge-details>summary::-webkit-details-marker{display:none}.merge-list{border-top:1px dashed #e1cd86;padding:4px 12px}.merge-row{padding:10px 0;border-bottom:1px solid #eee2bc}.merge-row:last-child{border:0}.merge-title{font-weight:800;color:var(--green);text-decoration:none}.merge-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12px;color:#6d665b}.sublist{margin:7px 0 0 16px;padding-left:14px;color:#6d665b;font-size:12px}.empty{padding:18px;background:var(--cream);border-radius:14px;color:var(--muted)}
@media(max-width:900px){.metrics,.compare{grid-template-columns:1fr 1fr}.source-grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr 1fr}}@media(max-width:650px){main{width:min(100% - 16px,1180px)}.hero{padding:22px 18px}.inside{padding:18px}.tools{grid-template-columns:1fr}.metric strong,.compare-card strong{font-size:23px}}
</style>
</head>
<body>
<div class="preview-banner">🧪 PREVIEW 測試版本｜不影響正式網站</div>
<div class="top">Banqiao House Monitor · Preview</div>
<main>
<section class="hero">
<div class="eyebrow">比對591、信義刊登案件</div>
<h1>指定路段案件比對</h1>
<div class="metrics">
<div class="metric"><span>監控路段</span><strong id="mRoads">7 條</strong></div>
<div class="metric"><span>整併後房屋</span><strong id="mGroups">-</strong></div>
<div class="metric"><span>原始有效刊登</span><strong id="mRaw">-</strong></div>
<div class="metric"><span>跨平台整併</span><strong id="mMerged">-</strong></div>
</div>
</section>
<section class="panel"><div class="stripe"></div><div class="inside"><div class="eyebrow">MONITOR STATUS</div><h2>資料來源</h2><div class="source-grid" id="sources"></div></div></section>
<section class="panel"><div class="stripe"></div><div class="inside">
<div class="eyebrow">COMPANY MATCH</div><h2>委託比對</h2>
<div class="compare">
<div class="compare-card"><span>庫存</span><strong id="cStock">-</strong></div>
<div class="compare-card review"><span>待確認</span><strong id="cReview">-</strong></div>
<div class="compare-card missing"><span>未接回</span><strong id="cMissing">-</strong></div>
<div class="compare-card unavailable"><span>尚未比對</span><strong id="cUnavailable">-</strong></div>
</div>
</div></section>
<section class="panel"><div class="stripe"></div><div class="inside">
<div class="eyebrow">PROPERTY GROUPS</div><h2>整併後案件列表</h2>
<div class="tools">
<select id="source"><option value="all">全部來源</option><option value="sinyi">含信義房屋</option><option value="591">含591</option><option value="cross">只看跨平台整併</option></select>
<select id="state"><option value="all">全部上架狀態</option><option value="new">近期新案</option><option value="active">已上架</option></select>
<select id="companyState"><option value="all">全部公司狀態</option><option value="company_match">庫存</option><option value="review">待確認</option><option value="missing">未接回</option><option value="unavailable">尚未比對</option></select>
<select id="sort"><option value="default">預設排序</option><option value="priceDesc">售價：高 → 低</option><option value="priceAsc">售價：低 → 高</option><option value="timeDesc">上架時間：新 → 舊</option><option value="timeAsc">上架時間：舊 → 新</option></select>
</div>
<div class="note" id="updated">正在讀取資料…</div><div id="groups"></div>
</div></section>
</main>
<script>
const defaultRoads=['板橋區中山路二段','板橋區三民路二段','板橋區光復街','板橋區萬安街','板橋區林森街','板橋區三民路一段','板橋區翠華街'];
let DATA={listings:[],runs:{},watchRoads:defaultRoads};let GAP={propertyGroups:[],comparisons:[],counts:{},coveredRoads:[]};let CMAP=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return '-';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'medium',timeZone:'Asia/Taipei'}).format(d)};
const fmtUnix=v=>{if(!v)return '-';const n=Number(v);return Number.isFinite(n)?fmt(n<1e12?n*1000:n):fmt(v)};
const priceValue=x=>{if(x.effectivePrice!=null)return Number(x.effectivePrice);const m=String(x.price||'').replace(/,/g,'').match(/\d+(?:\.\d+)?/);return m?Number(m[0]):null};
const displayPrice=x=>x.effectivePrice!=null?`${x.effectivePrice}萬`:(x.price||'-');
const isNew=x=>x.newAt&&Date.now()-new Date(x.newAt).getTime()<=14*86400000;
const cmp=x=>CMAP.get(x.groupId)||null;
const companyLabel=s=>({company_match:'庫存',review:'待確認',missing:'未接回',unavailable:'尚未比對'}[s]||s||'尚未比對');
const companyClass=s=>s==='company_match'?'stock':s==='review'?'review':s==='missing'?'missing':'unavailable';
function sourcePills(g){return (g.sources||[]).map(s=>`<span class="pill ${s==='信義房屋'?'sinyi':'m591'}">${esc(s)}</span>`).join('')}
function sourceDetails(g){const rows=(g.sourceListings||[]).map((m,i)=>{const primary=m.id===g.primaryId;const nested=(m.mergedListings||[]);const nestedHtml=nested.length>1?`<ul class="sublist">${nested.map(n=>`<li><a href="${esc(n.url||'#')}" target="_blank" rel="noreferrer">${esc(n.title||n.houseId||n.id||'591刊登')}</a>｜${esc(n.price||'')} ${esc(n.size||'')}</li>`).join('')}</ul>`:'';return `<div class="merge-row"><div>${primary?'<span class="pill primary">主資料</span>':''}<span class="pill ${m.source==='信義房屋'?'sinyi':'m591'}">${esc(m.source)}</span></div><a class="merge-title" href="${esc(m.url||'#')}" target="_blank" rel="noreferrer">${esc(m.title||m.id)}</a><div class="merge-meta"><span>${esc(displayPrice(m))}</span><span>${esc(m.size||'-')}</span><span>${esc(m.address||'-')}</span><span>上架：${fmtUnix(m.sourcePublishedAt)}</span>${m.source==='591'&&nested.length?`<span>591原始刊登 ${nested.length} 筆</span>`:''}</div>${nestedHtml}</div>`}).join('');return `<details class="merge-details"><summary>查看來源整併明細（${g.rawListingCount||1} 筆原始刊登）</summary><div class="merge-list">${rows}</div></details>`}
function candidateLine(g){const c=cmp(g);if(!c||!c.companyCandidate||!['company_match','review'].includes(c.status))return '';const y=c.companyCandidate;const link=y.url?`<a href="${esc(y.url)}" target="_blank" rel="noreferrer">${esc(y.title||y.id)}</a>`:esc(y.title||y.id);return `<div class="row candidate">比對庫存：${link}${y.price!=null?`｜${esc(y.price)}萬`:''}${y.area!=null?`｜${esc(y.area)}坪`:''}</div>`}
function sortGroups(items,mode){const a=[...items];if(mode==='default')return a;const key=mode.startsWith('price')?priceValue:x=>{const n=Number(x.sourcePublishedAt);return Number.isFinite(n)?(n<1e12?n:n/1000):0};const dir=mode.endsWith('Desc')?-1:1;return a.sort((x,y)=>(key(x)-key(y))*dir)}
function render(){const roads=DATA.watchRoads||defaultRoads;const groups=GAP.propertyGroups||[];document.querySelector('#mRoads').textContent=`${roads.length} 條`;document.querySelector('#mGroups').textContent=`${GAP.propertyGroupCount??groups.length} 戶`;document.querySelector('#mRaw').textContent=`${GAP.rawListingCount??GAP.externalActiveCount??0} 筆`;document.querySelector('#mMerged').textContent=`${GAP.crossPlatformMergedGroupCount??0} 戶`;
const c=GAP.counts||{};document.querySelector('#cStock').textContent=`${c.company_match??0} 戶`;document.querySelector('#cReview').textContent=`${c.review??0} 戶`;document.querySelector('#cMissing').textContent=`${c.missing??0} 戶`;document.querySelector('#cUnavailable').textContent=`${c.unavailable??0} 戶`;
const cards=['591','信義房屋'].map(name=>{const r=DATA.runs?.[name],ok=r?.status==='ok';return `<div class="source-card"><div class="source-head"><strong>${name}</strong><span class="badge ${ok?'ok':'err'}">${ok?'正常':'異常/沿用'}</span></div><div class="note">目前保留 ${r?.totalCount??0} 筆<br>最近更新：${fmt(r?.checkedAt)}</div></div>`});document.querySelector('#sources').innerHTML=cards.join('');
document.querySelector('#updated').textContent=`來源資料最近更新：${fmt(DATA.updatedAt)}｜Preview 比對：${fmt(GAP.generatedAt)}。`;
renderGroups()}
function renderGroups(){const source=document.querySelector('#source').value,state=document.querySelector('#state').value,cs=document.querySelector('#companyState').value,sort=document.querySelector('#sort').value;let rows=(GAP.propertyGroups||[]).filter(g=>{const c=cmp(g);const sourceOK=source==='all'||(source==='sinyi'&&(g.sources||[]).includes('信義房屋'))||(source==='591'&&(g.sources||[]).includes('591'))||(source==='cross'&&g.crossPlatformMerged);const stateOK=state==='all'||(state==='new'&&isNew(g))||(state==='active'&&!isNew(g));const compOK=cs==='all'||c?.status===cs;return sourceOK&&stateOK&&compOK});let html='';for(const road of (DATA.watchRoads||defaultRoads)){const items=sortGroups(rows.filter(g=>g.road===road),sort);if(!items.length)continue;html+=`<details class="road-group"><summary><span>${esc(road)}</span><span class="count">${items.length} 戶</span></summary><div class="list">${items.map(g=>{const c=cmp(g),st=c?.status||'unavailable';return `<article class="item"><a class="item-title" href="${esc(g.url||'#')}" target="_blank" rel="noreferrer">${esc(g.title||g.primaryId)}</a><div class="row">${sourcePills(g)}<span class="pill ${companyClass(st)}">${companyLabel(st)}</span>${g.crossPlatformMerged?'<span class="pill merged">信義主資料＋591整併</span>':''}${isNew(g)?'<span class="pill sinyi">近期新案</span>':''}<span>${esc(displayPrice(g))}</span><span>${esc(g.size||'-')}</span><span>${esc(g.address||'-')}</span></div>${candidateLine(g)}${sourceDetails(g)}</article>`}).join('')}</div></details>`}document.querySelector('#groups').innerHTML=html||'<div class="empty">目前沒有符合條件的房屋群組。</div>'}
['source','state','companyState','sort'].forEach(id=>document.querySelector('#'+id).addEventListener('change',renderGroups));
Promise.all([fetch(`../data/listings.json?ts=${Date.now()}`,{cache:'no-store'}).then(r=>r.json()),fetch(`company-gap.json?ts=${Date.now()}`,{cache:'no-store'}).then(r=>r.ok?r.json():null)]).then(([d,g])=>{DATA=d;if(g)GAP=g;CMAP=new Map((GAP.comparisons||[]).map(x=>[x.groupId,x]));render()}).catch(e=>{document.querySelector('#updated').textContent='Preview 資料讀取失敗：'+e;});
</script>
</body>
</html>
