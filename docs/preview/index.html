<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="板橋新案監控 Preview" />
<link rel="apple-touch-icon" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211301" />
<link rel="icon" type="image/png" sizes="32x32" href="/banqiao-house-monitor/icon-safe-32.png?v=202608211301" />

<title>Banqiao House Monitor Preview</title>
<style>
:root{--cream:#fff8df;--paper:#fffef8;--yellow:#f5d331;--green:#124b37;--red:#cf3f4a;--ink:#30312f;--muted:#756f64;--line:#e3ca73;--gray:#515861}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}a{color:inherit}
.preview-banner{position:sticky;top:0;z-index:20;background:#1f2937;color:#fff;padding:10px 16px;text-align:center;font-size:14px;font-weight:900}.top{position:sticky;top:39px;z-index:10;background:#fff;border-bottom:1px solid #eee;padding:15px;text-align:center;font-weight:900}
main{width:min(1180px,calc(100% - 24px));margin:auto;padding:22px 0 60px}.hero{background:var(--yellow);border-radius:28px;padding:28px}.hero h1{color:var(--green);font-size:clamp(34px,7vw,56px);margin:8px 0 12px}.hero p{color:#315244;line-height:1.8}.eyebrow{font-size:13px;font-weight:900;letter-spacing:.12em;color:#936d00}
.metrics,.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.metric,.compare-card{background:#fffef8;border:1px solid #dcc875;border-radius:20px;padding:16px}.metric span,.compare-card span{display:block;color:var(--muted);font-size:13px;font-weight:800}.metric strong,.compare-card strong{display:block;color:var(--green);font-size:27px;margin-top:5px}.compare-card.review strong{color:#8a6500}.compare-card.missing strong{color:#a52d39}.compare-card.unavailable strong{color:#62686e}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:26px;overflow:hidden;margin-top:18px}.stripe{height:7px;background:linear-gradient(90deg,var(--red) 0 66%,var(--gray) 66%)}.inside{padding:22px}.inside h2{margin:5px 0 16px}.note{font-size:13px;color:var(--muted);line-height:1.75;margin:12px 0}.company-note{background:#fff5ce;border:1px solid #e6cc72;border-radius:14px;padding:12px 14px;color:#66571f;font-size:13px;line-height:1.75}
.source-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.source-card{background:var(--cream);border:1px solid #ead58b;border-radius:17px;padding:15px}.source-head{display:flex;justify-content:space-between;gap:8px}.source-head strong{color:var(--green)}.badge,.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}.ok{background:#dcefe7;color:#14503c}.stale{background:#fff0bd;color:#8a6500}.err{background:#f7dadd;color:#972a35}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.tools select{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font:inherit}.source-tabs{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.source-tab{appearance:none;border:1px solid var(--line);border-radius:12px;padding:11px 8px;background:#fff;color:var(--ink);font:inherit;font-weight:850;cursor:pointer}.source-tab.active{background:var(--green);border-color:var(--green);color:#fff}
.road-group{border:1px solid var(--line);border-radius:17px;overflow:hidden;background:#fff;margin:10px 0}.road-group>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:15px;background:#fff4c8;color:var(--green);font-weight:900}.road-group>summary::-webkit-details-marker{display:none}.count{background:var(--green);color:#fff;border-radius:999px;padding:4px 9px;font-size:12px}.list{padding:0 14px}.item{padding:15px 0;border-bottom:1px solid #f0e5bd}.item:last-child{border-bottom:0}.item-title{font-weight:900;color:var(--green);text-decoration:none;line-height:1.5}.row{display:flex;flex-wrap:wrap;gap:7px 12px;margin-top:8px;color:#645e54;font-size:13px;align-items:center}.pill{background:#eee9df;color:#625a4d}.pill.sinyi{background:#dcefe7;color:#14503c}.pill.m591{background:#e8eef9;color:#35577d}.pill.stock{background:#124b37;color:#fff}.pill.review{background:#fff0bd;color:#755600;border:1px solid #e3ca73}.pill.missing{background:#f7dadd;color:#972a35}.pill.unavailable{background:#e9ecef;color:#5d6268}.pill.merged{background:#fff3b0;color:#755600;border:1px solid #dfc25f}.pill.primary{background:#124b37;color:#fff}.candidate{font-size:12px;color:#756f64}.merge-details{margin-top:11px;border:1px dashed #d8bd61;border-radius:13px;background:#fffaf0;overflow:hidden}.merge-details>summary{cursor:pointer;list-style:none;padding:10px 12px;font-size:13px;font-weight:900;color:#755600}.merge-details>summary::-webkit-details-marker{display:none}.merge-list{border-top:1px dashed #e1cd86;padding:4px 12px}.merge-row{padding:10px 0;border-bottom:1px solid #eee2bc}.merge-row:last-child{border:0}.merge-title{font-weight:800;color:var(--green);text-decoration:none}.merge-meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:5px;font-size:12px;color:#6d665b}.sublist{margin:7px 0 0 16px;padding-left:14px;color:#6d665b;font-size:12px}.empty{padding:18px;background:var(--cream);border-radius:14px;color:var(--muted)}
@media(max-width:900px){.metrics,.compare{grid-template-columns:1fr 1fr}.source-grid{grid-template-columns:1fr}.tools{grid-template-columns:1fr 1fr 1fr}}@media(max-width:650px){main{width:min(100% - 16px,1180px)}.hero{padding:22px 18px}.inside{padding:18px}.tools{grid-template-columns:1fr}.source-tabs{grid-column:1;grid-template-columns:repeat(3,1fr)}.metric strong,.compare-card strong{font-size:23px}}

.market-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 18px}
.market-btn{appearance:none;border:1.5px solid #dfbf55;background:#fffdf7;color:#2f302f;border-radius:18px;padding:13px 16px;font-size:17px;font-weight:800;cursor:pointer}
.market-btn.active{background:#0f5945;color:#fff;border-color:#0f5945;box-shadow:0 5px 14px rgba(15,89,69,.14)}
.market-note{font-size:13px;color:#777;margin:-6px 0 14px}
.rent-item .row{align-items:center}
.rent-price{font-weight:900;color:#0f5945;font-size:18px}


.pill.change-new{background:#dcefe7;color:#14503c;border:1px solid #b8daca}
.pill.change-down{background:#f7dadd;color:#972a35;border:1px solid #e9b8bf}
.pill.change-up{background:#e8eef9;color:#35577d;border:1px solid #cad8ef}
.pill.change-removed{background:#eceff1;color:#50575e;border:1px solid #d4d9dd}
.change-price-line{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff7e1;font-size:13px;font-weight:850;color:#6d5b20}
.change-price-line.down{background:#fff0f1;color:#972a35}
.change-price-line.up{background:#eef4ff;color:#35577d}

.pill.today-new{background:#ffe9a8;color:#704d00;border:1px solid #ddb948}
</style>
</head>
<body>
<div class="preview-banner">🧪 PREVIEW 測試版本｜不影響正式網站</div>
<div class="top">Banqiao House Monitor · Preview</div>
<main>
<section class="hero">
<div class="eyebrow">比對591、信義刊登案件</div>
<h1>指定路段上架案件比對</h1>
<div class="metrics">
<div class="metric"><span>監控路段</span><strong id="mRoads">7 條</strong></div>
<div class="metric"><span>刊登中</span><strong id="mGroups">-</strong></div>
<div class="metric"><span>新進案件</span><strong id="mNew">-</strong></div>
<div class="metric"><span>原始刊登數量</span><strong id="mMerged">-</strong></div>
</div>
</section>
<section class="panel"><div class="stripe"></div><div class="inside"><div class="eyebrow">MONITOR STATUS</div><h2>資料來源</h2><div class="market-switch" id="marketSwitch">
<button type="button" class="market-btn active" data-market="sale">售屋</button>
<button type="button" class="market-btn" data-market="rent">租屋</button>
</div><div class="source-grid" id="sources"></div></div></section>
<section class="panel" id="companyPanel"><div class="stripe"></div><div class="inside">
<div class="eyebrow">COMPANY MATCH</div><h2>委託比對</h2>
<div class="compare">
<div class="compare-card"><span>庫存</span><strong id="cStock">-</strong></div>
<div class="compare-card review"><span>待確認</span><strong id="cReview">-</strong></div>
<div class="compare-card missing"><span>未接回</span><strong id="cMissing">-</strong></div>
<div class="compare-card unavailable"><span>已下架</span><strong id="cUnavailable">-</strong></div>
</div>
</div></section>
<section class="panel"><div class="stripe"></div><div class="inside">
<div class="eyebrow">PROPERTY GROUPS</div><h2 id="listTitle">整併後案件列表</h2>
<div class="tools">
<div class="source-tabs" id="sourceTabs">
<button type="button" class="source-tab active" data-source="all">全部案件</button>
<button type="button" class="source-tab" data-source="sinyi">信義</button>
<button type="button" class="source-tab" data-source="591">591</button>
</div>
<select id="state"><option value="all">全部上架狀態</option><option value="new">新進案件</option><option value="active">已上架</option><option value="changed">本次異動</option><option value="removed">已下架</option></select>
<select id="companyState"><option value="all">全部公司狀態</option><option value="company_match">庫存</option><option value="review">待確認</option><option value="missing">未接回</option><option value="unavailable">尚未比對</option></select>
<select id="sort"><option value="default">預設排序</option><option value="priceDesc">售價：高 → 低</option><option value="priceAsc">售價：低 → 高</option><option value="timeDesc" selected>上架時間：新 → 舊</option><option value="timeAsc">上架時間：舊 → 新</option></select>
</div>
<div class="note" id="updated" aria-live="polite">正在讀取資料…</div><div id="groups"></div>
</div></section>
</main>
<script>
const defaultRoads=['板橋區中山路二段','板橋區三民路二段','板橋區光復街','板橋區萬安街','板橋區林森街','板橋區三民路一段','板橋區翠華街'];
let DATA={listings:[],runs:{},watchRoads:defaultRoads};let GAP={propertyGroups:[],comparisons:[],counts:{},coveredRoads:[]};let VERIFY=null;let RENT={listings:[],runs:{},watchRoads:defaultRoads,counts:{}};let MARKET_MODE='sale';let CMAP=new Map();let SOURCE_FILTER='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=v=>{if(!v)return '-';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'medium',timeZone:'Asia/Taipei'}).format(d)};
const fmtUnix=v=>{if(!v)return '-';const n=Number(v);return Number.isFinite(n)?fmt(n<1e12?n*1000:n):fmt(v)};
const priceValue=x=>{if(x.effectivePrice!=null)return Number(x.effectivePrice);const m=String(x.price||'').replace(/,/g,'').match(/\d+(?:\.\d+)?/);return m?Number(m[0]):null};
const displayPrice=x=>x.effectivePrice!=null?`${x.effectivePrice}萬`:(x.price||'-');
const isNew=x=>x.newAt&&Date.now()-new Date(x.newAt).getTime()<=14*86400000;
const cmp=x=>CMAP.get(x.groupId)||null;
const companyLabel=s=>({company_match:'庫存',review:'待確認',missing:'未接回',unavailable:'尚未比對',offmarket:'已下架'}[s]||s||'尚未比對');
const companyClass=s=>s==='company_match'?'stock':s==='review'?'review':(s==='missing'||s==='offmarket')?'missing':'unavailable';
function sourcePills(g){return (g.sources||[]).map(s=>`<span class="pill ${s==='信義房屋'?'sinyi':'m591'}">${esc(s)}</span>`).join('')}
function sourceDetails(g){const rows=(g.sourceListings||[]).map((m,i)=>{const primary=m.id===g.primaryId;const nested=(m.mergedListings||[]);const nestedHtml=nested.length>1?`<ul class="sublist">${nested.map(n=>`<li><a href="${esc(n.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(n.title||n.houseId||n.id||'591刊登')}</a>｜${esc(n.price||'')} ${esc(n.size||'')}</li>`).join('')}</ul>`:'';return `<div class="merge-row"><div>${primary?'<span class="pill primary">主資料</span>':''}<span class="pill ${m.source==='信義房屋'?'sinyi':'m591'}">${esc(m.source)}</span></div><a class="merge-title" href="${esc(m.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(m.title||m.id)}</a><div class="merge-meta"><span>${esc(displayPrice(m))}</span><span>${esc(m.size||'-')}</span><span>${esc(m.address||'-')}</span><span>上架：${fmtUnix(m.sourcePublishedAt)}</span>${m.source==='591'&&nested.length?`<span>591原始刊登 ${nested.length} 筆</span>`:''}</div>${nestedHtml}</div>`}).join('');return `<details class="merge-details"><summary>查看來源整併明細（${g.rawListingCount||1} 筆原始刊登）</summary><div class="merge-list">${rows}</div></details>`}
function candidateLine(g){
  const c=cmp(g);
  if(!c||!c.companyCandidate||!['company_match','review'].includes(c.status))return '';
  const y=c.companyCandidate;
  const link=y.url?`<a href="${esc(y.url)}" target="_blank" rel="noopener noreferrer">${esc(y.title||y.id)}</a>`:esc(y.title||y.id);
  const id=y.officialCaseId||y.officialId||String(y.id||'').replace(/^YC:/,'');
  return `<div class="row candidate">比對庫存：<span class="pill primary">永慶 ID ${esc(id||'-')}</span>${link}${y.price!=null?`｜${esc(y.price)}萬`:''}${y.area!=null?`｜${esc(y.area)}坪`:''}${y.floor?`｜${esc(y.floor)}`:'｜樓層未取得'}</div>`;
}
function sortGroups(items,mode){const a=[...items];if(mode==='default')return a;const key=mode.startsWith('price')?priceValue:x=>{const n=Number(x.sourcePublishedAt);return Number.isFinite(n)?(n<1e12?n:n/1000):0};const dir=mode.endsWith('Desc')?-1:1;return a.sort((x,y)=>(key(x)-key(y))*dir)}
function render(){const roads=DATA.watchRoads||defaultRoads;const groups=GAP.propertyGroups||[];document.querySelector('#mRoads').textContent=`${roads.length} 條`;document.querySelector('#mGroups').textContent=`${GAP.propertyGroupCount??groups.length} 戶`;document.querySelector('#mNew').textContent=`${groups.filter(isNew).length} 戶`;document.querySelector('#mMerged').textContent=`${GAP.rawListingCount??GAP.externalActiveCount??0} 筆`;
const c=GAP.counts||{};document.querySelector('#cStock').textContent=`${c.company_match??0} 戶`;document.querySelector('#cReview').textContent=`${c.review??0} 戶`;document.querySelector('#cMissing').textContent=`${c.missing??0} 戶`;document.querySelector('#cUnavailable').textContent=`${GAP.recentOffMarketCount??0} 戶`;
const cards=['591','信義房屋'].map(name=>{const r=DATA.runs?.[name],ok=r?.status==='ok';return `<div class="source-card"><div class="source-head"><strong>${name}</strong><span class="badge ${ok?'ok':'err'}">${ok?'正常':'異常/沿用'}</span></div><div class="note">目前刊登 ${r?.totalCount??0} 筆<br>最近更新：${fmt(r?.checkedAt)}</div></div>`});document.querySelector('#sources').innerHTML=cards.join('');
document.querySelector('#updated').innerHTML=`來源資料最近更新：${fmt(DATA.updatedAt)}<br>委託比對：${fmt(GAP.generatedAt)}。`;
renderGroups()}
function monitorRunMs(){
  const raw=DATA?.runs?.priceTracking?.checkedAt||DATA?.updatedAt;
  const ms=new Date(raw||0).getTime();
  return Number.isFinite(ms)?ms:0;
}
function sameMonitorRun(value){
  const a=new Date(value||0).getTime(),b=monitorRunMs();
  return Number.isFinite(a)&&a>0&&b>0&&Math.abs(a-b)<=180000;
}
function allMonitorListings(){
  const out=[],seen=new Set();
  const visit=(row,parentRoad)=>{
    if(!row||typeof row!=='object')return;
    const id=row.id||null;
    if(id&&!seen.has(id)){seen.add(id);out.push({...row,road:row.road||parentRoad});}
    for(const child of (row.mergedListings||[]))visit(child,row.road||parentRoad);
  };
  for(const row of (DATA.listings||[]))visit(row,row?.road);
  return out;
}
function groupListingIds(g){
  const ids=new Set();
  const visit=row=>{
    if(!row||typeof row!=='object')return;
    if(row.id)ids.add(String(row.id));
    for(const child of (row.mergedListings||[]))visit(child);
  };
  if(g?.primaryId)ids.add(String(g.primaryId));
  for(const row of (g?.sourceListings||[]))visit(row);
  return ids;
}
function monitorRowsForGroup(g){
  const ids=groupListingIds(g);
  const rows=allMonitorListings().filter(row=>row?.id&&ids.has(String(row.id)));
  return rows.length?rows:(g?.sourceListings||[]);
}
function latestPriceChange(row){
  const h=(row?.priceHistory||[]).filter(x=>x&&Number.isFinite(Number(x.price))&&x.at);
  if(h.length<2)return null;
  const last=h[h.length-1],prev=h[h.length-2];
  if(!sameMonitorRun(last.at))return null;
  const from=Number(prev.price),to=Number(last.price),delta=to-from;
  if(!Number.isFinite(from)||!Number.isFinite(to)||delta===0)return null;
  return {from,to,delta,at:last.at,id:row.id,source:row.source};
}
function groupChangeInfo(g){
  const rows=monitorRowsForGroup(g);
  const prices=rows.map(latestPriceChange).filter(Boolean).sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta));
  const hasNew=rows.length>0&&rows.every(x=>sameMonitorRun(x?.newAt));
  const hasRemoved=!!(g?.offMarket&&sameMonitorRun(g?.removedAt))||rows.some(x=>sameMonitorRun(x?.removedAt));
  const priceChange=prices[0]||null;
  const stamps=[];
  if(priceChange)stamps.push(new Date(priceChange.at).getTime());
  if(hasNew)for(const x of rows)if(sameMonitorRun(x?.newAt))stamps.push(new Date(x.newAt).getTime());
  if(hasRemoved){
    if(g?.removedAt)stamps.push(new Date(g.removedAt).getTime());
    for(const x of rows)if(sameMonitorRun(x?.removedAt))stamps.push(new Date(x.removedAt).getTime());
  }
  return {changed:!!(hasNew||hasRemoved||priceChange),hasNew,hasRemoved,priceChange,timestamp:Math.max(0,...stamps.filter(Number.isFinite))};
}
function currentChangedGroups(){
  const active=(GAP.propertyGroups||[]).filter(g=>groupChangeInfo(g).changed);
  const removed=(GAP.recentOffMarketGroups||[]).filter(g=>groupChangeInfo(g).changed);
  return [...active,...removed];
}
function changeBadges(g){
  const info=groupChangeInfo(g),out=[];
  if(info.hasNew)out.push('<span class="pill change-new">本次新進</span>');
  if(info.priceChange){
    const d=info.priceChange.delta;
    out.push(`<span class="pill ${d<0?'change-down':'change-up'}">${d<0?'降價':'漲價'} ${Math.abs(d).toLocaleString('zh-TW')}萬</span>`);
  }
  if(info.hasRemoved)out.push('<span class="pill change-removed">本次下架</span>');
  return out.join('');
}
function changePriceLine(g){
  const p=groupChangeInfo(g).priceChange;
  if(!p)return '';
  const down=p.delta<0;
  return `<div class="change-price-line ${down?'down':'up'}">${down?'🔻':'🔺'} ${p.from.toLocaleString('zh-TW')}萬 → ${p.to.toLocaleString('zh-TW')}萬｜${down?'降':'漲'} ${Math.abs(p.delta).toLocaleString('zh-TW')}萬</div>`;
}
function bindRoadAccordion(){
  document.querySelectorAll('#groups details.road-group').forEach(group=>{
    if(group.dataset.singleOpenBound==='1')return;
    group.dataset.singleOpenBound='1';
    group.addEventListener('toggle',()=>{
      if(!group.open)return;
      document.querySelectorAll('#groups details.road-group[open]').forEach(other=>{
        if(other!==group)other.open=false;
      });
    });
  });
}
function renderGroups(){
  if(typeof MARKET_MODE!=='undefined' && MARKET_MODE==='rent' && typeof renderRentGroups==='function') return renderRentGroups();
  const source=SOURCE_FILTER,state=document.querySelector('#state').value,cs=document.querySelector('#companyState').value,sort=document.querySelector('#sort').value;
  const baseRows=state==='changed'?currentChangedGroups():state==='removed'?(GAP.recentOffMarketGroups||[]):(GAP.propertyGroups||[]);
  let rows=baseRows.filter(g=>{
    const c=cmp(g);
    const sourceOK=source==='all'||(source==='sinyi'&&(g.sources||[]).includes('信義房屋'))||(source==='591'&&(g.sources||[]).includes('591'));
    const stateOK=state==='changed'?groupChangeInfo(g).changed:state==='removed'?g.offMarket===true:(state==='all'||(state==='new'&&isNew(g))||(state==='active'&&!isNew(g)));
    const compOK=(state==='removed'||g.offMarket)?true:(cs==='all'||c?.status===cs);
    return sourceOK&&stateOK&&compOK;
  });
  let html='';
  for(const road of (DATA.watchRoads||defaultRoads)){
    let items=rows.filter(g=>g.road===road);
    if(state==='changed'&&sort==='default')items=[...items].sort((a,b)=>groupChangeInfo(b).timestamp-groupChangeInfo(a).timestamp);
    else if(state==='removed'&&sort==='default')items=[...items].sort((a,b)=>new Date(b.removedAt||0)-new Date(a.removedAt||0));
    else items=sortGroups(items,sort);
    if(!items.length)continue;
    html+=`<details class="road-group"><summary><span>${esc(road)}</span><span class="count">${items.length} 戶</span></summary><div class="list">${items.map(g=>{
      const c=cmp(g),st=g.offMarket?'offmarket':(c?.status||'unavailable'),change=groupChangeInfo(g);
      const removedLine=g.offMarket&&g.removedAt?`<span>下架：${fmt(g.removedAt)}</span>`:'';
      return `<article class="item" data-change="${change.changed?'1':'0'}"><a class="item-title" href="${esc(g.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(g.title||g.primaryId)}</a><div class="row">${sourcePills(g)}<span class="pill ${companyClass(st)}">${companyLabel(st)}</span>${changeBadges(g)}${g.crossPlatformMerged?'<span class="pill merged">信義主資料＋591整併</span>':''}${!g.offMarket&&isNew(g)?'<span class="pill sinyi">新進案件</span>':''}<span>${esc(displayPrice(g))}</span><span>${esc(g.size||'-')}</span><span>${esc(g.address||'-')}</span>${removedLine}</div>${changePriceLine(g)}${g.offMarket?'':candidateLine(g)}${sourceDetails(g)}</article>`;
    }).join('')}</div></details>`;
  }
  document.querySelector('#groups').innerHTML=html||'<div class="empty">目前沒有符合條件的房屋群組。</div>';
  bindRoadAccordion();
}


















































































































function rentalPrice(x){const n=Number(x?.rent);return Number.isFinite(n)&&n>0?`${Math.round(n).toLocaleString('zh-TW')} 元/月`:'租金未取得'}
function rentalFirstSeenMs(x){const t=new Date(x?.firstSeenAt||0).getTime();return Number.isFinite(t)?t:0}
function rentalIsNew(x){
  const first=rentalFirstSeenMs(x);
  const configured=new Date(RENT.newListingBaselineAt||0).getTime();
  const aug24Baseline=Date.parse('2026-08-24T16:00:00Z');
  const baseline=Math.max(Number.isFinite(configured)?configured:0,aug24Baseline);
  const days=Number(RENT.newListingWindowDays??3);
  if(!Number.isFinite(first)||!Number.isFinite(baseline)||first<baseline||!Number.isFinite(days)||days<=0)return false;
  const age=Date.now()-first;
  return age>=0&&age<days*86400000;
}
function taipeiDateKey(value){
  const d=new Date(value||0);
  if(Number.isNaN(d.getTime()))return '';
  return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
function rentalIsTodayNew(x){
  return rentalIsNew(x)&&taipeiDateKey(x?.firstSeenAt)===taipeiDateKey(Date.now());
}
function renderRentGroups(){
  const roads=RENT.watchRoads||defaultRoads;
  const source=SOURCE_FILTER;
  const state=document.querySelector('#state')?.value||'all';
  const sort=document.querySelector('#sort').value;
  let rows=(RENT.listings||[]).filter(x=>source==='all'||(source==='sinyi'&&x.source==='信義房屋')||(source==='591'&&x.source==='591'));
  if(state==='new')rows=rows.filter(rentalIsNew);
  if(sort==='priceDesc')rows.sort((a,b)=>(Number(b.rent)||0)-(Number(a.rent)||0));
  if(sort==='priceAsc')rows.sort((a,b)=>(Number(a.rent)||0)-(Number(b.rent)||0));
  if(sort==='timeDesc')rows.sort((a,b)=>rentalFirstSeenMs(b)-rentalFirstSeenMs(a));
  if(sort==='timeAsc')rows.sort((a,b)=>rentalFirstSeenMs(a)-rentalFirstSeenMs(b));
  let html='';
  for(const road of roads){
    const items=rows.filter(x=>x.road===road);
    if(!items.length)continue;
    html+=`<details class="road-group"><summary><span>${esc(road)}</span><span class="count">${items.length} 戶</span></summary><div class="list">${items.map(x=>{
      const cls=x.source==='信義房屋'?'sinyi':'m591';
      const label=x.source==='信義房屋'?'信義':'591';
      const size=Number(x.size); const sizeText=Number.isFinite(size)&&size>0?`${size}坪`:'坪數未取得';
      const newBadge=rentalIsTodayNew(x)?'<span class="pill today-new">今日新案</span>':(rentalIsNew(x)?'<span class="pill sinyi">新案</span>':'');
      return `<article class="item rent-item"><a class="item-title" href="${esc(x.url||'#')}" target="_blank" rel="noopener noreferrer">${esc(x.title||x.houseId||'租屋案件')}</a><div class="row"><span class="pill ${cls}">${label}</span>${newBadge}<span class="rent-price">${esc(rentalPrice(x))}</span><span>${esc(sizeText)}</span><span>${esc(x.address||road)}</span><span>首次抓到：${fmt(x.firstSeenAt)}</span></div></article>`;
    }).join('')}</div></details>`;
  }
  document.querySelector('#groups').innerHTML=html||'<div class="empty">目前這 7 條路沒有抓到符合條件的租屋案件。</div>';
  bindRoadAccordion();
}
function renderRent(){
  const roads=RENT.watchRoads||defaultRoads;
  const listings=RENT.listings||[];
  const newCount=listings.filter(rentalIsNew).length;
  document.querySelector('#mRoads').textContent=`${roads.length} 條`;
  document.querySelector('#mGroups').textContent=`${listings.length} 戶`;
  document.querySelector('#mNew').textContent=`${newCount} 戶`;
  document.querySelector('#mMerged').textContent=`${listings.length} 筆`;
  const cards=['591','信義房屋'].map(name=>{const r=RENT.runs?.[name],ok=r?.status==='ok';return `<div class="source-card"><div class="source-head"><strong>${name}</strong><span class="badge ${ok?'ok':'err'}">${ok?'正常':'異常'}</span></div><div class="note">目前刊登 ${r?.totalCount??0} 筆<br>最近更新：${fmt(RENT.updatedAt)}</div></div>`});
  document.querySelector('#sources').innerHTML=cards.join('');
  document.querySelector('#updated').innerHTML=`租屋資料最近更新：${fmt(RENT.updatedAt)}<br>新案以本監控首次抓到時間計算；今日新案依台灣日期判斷，新案標籤保留 ${RENT.newListingWindowDays??3} 天。`;
  renderRentGroups();
}
function setMarket(mode){
  MARKET_MODE=mode==='rent'?'rent':'sale'; SOURCE_FILTER='all';
  document.querySelectorAll('.market-btn').forEach(b=>b.classList.toggle('active',b.dataset.market===MARKET_MODE));
  document.querySelectorAll('.source-tab').forEach(b=>b.classList.toggle('active',b.dataset.source==='all'));
  const rent=MARKET_MODE==='rent';
  const company=document.querySelector('#companyPanel'); if(company)company.style.display=rent?'none':'';
  const state=document.querySelector('#state');
  if(state){
    state.style.display='';
    state.innerHTML=rent
      ? '<option value="all">全部案件</option><option value="new">新案</option>'
      : '<option value="all">全部上架狀態</option><option value="new">新進案件</option><option value="active">已上架</option><option value="changed">本次異動</option><option value="removed">已下架</option>';
    state.value='all';
  }
  const companyState=document.querySelector('#companyState'); if(companyState){companyState.style.display=rent?'none':'';companyState.value='all';}
  const title=document.querySelector('#listTitle'); if(title)title.textContent=rent?'租屋案件列表':'整併後案件列表';
  const sort=document.querySelector('#sort');
  if(sort&&sort.options.length>=5){
    sort.options[1].textContent=rent?'租金：高 → 低':'售價：高 → 低';
    sort.options[2].textContent=rent?'租金：低 → 高':'售價：低 → 高';
    sort.options[3].textContent=rent?'首次抓到：新 → 舊':'上架時間：新 → 舊';
    sort.options[4].textContent=rent?'首次抓到：舊 → 新':'上架時間：舊 → 新';
    sort.value='timeDesc';
  }
  if(rent)renderRent(); else render();
}
document.querySelectorAll('.market-btn').forEach(btn=>btn.addEventListener('click',()=>setMarket(btn.dataset.market)));
fetchJson(`rental-data.json?ts=${Date.now()}`,'租屋資料').then(r=>{RENT=r;if(MARKET_MODE==='rent')renderRent()}).catch(e=>{console.warn('Rental Preview unavailable',e)});

document.querySelectorAll('.source-tab').forEach(btn=>btn.addEventListener('click',()=>{SOURCE_FILTER=btn.dataset.source||'all';document.querySelectorAll('.source-tab').forEach(x=>x.classList.toggle('active',x===btn));renderGroups()}));
['state','companyState','sort'].forEach(id=>document.querySelector('#'+id).addEventListener('change',renderGroups));
function sameCounts(a,b){
  return ['company_match','review','missing','unavailable'].every(k=>Number((a||{})[k]??-1)===Number((b||{})[k]??-2));
}
function verificationMatches(d,g,v){
  return !!(d&&g&&v&&v.valid===true&&v.scheme==='A'&&v.canonicalPublisher==='yungching-preview.yml'&&
    v.integrityVersion==='scheme-a-canonical-v3-sinyi-floor-neartie'&&v.fetchMode==='yungching_official_rendered_dom_only'&&
    v.snapshotCapturedAt===g.companySnapshotCapturedAt&&v.companyGapGeneratedAt===g.generatedAt&&
    v.sourceDataUpdatedAt===g.sourceDataUpdatedAt&&d.updatedAt===g.sourceDataUpdatedAt&&
    Number(v.companyListingCount)===Number(g.companyListingCount)&&Number(v.propertyGroupCount)===Number(g.propertyGroupCount)&&
    Number(v.rawListingCount)===Number(g.rawListingCount)&&Number(v.comparisonCount)===Number((g.comparisons||[]).length)&&
    sameCounts(v.counts,g.counts)&&(v.sinyiFloorEnrichment||{}).complete===true);
}
async function fetchJson(url,label){
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),12000);
  try{
    const r=await fetch(url,{cache:'no-store',signal:ctl.signal});
    if(!r.ok)throw new Error(`${label} HTTP ${r.status}`);
    return await r.json();
  }finally{clearTimeout(timer)}
}
Promise.all([
  fetchJson(`../data/listings.json?ts=${Date.now()}`,'監控資料'),
  fetchJson(`company-gap.json?ts=${Date.now()}`,'比對資料'),
  fetchJson(`scheme-a-verification.json?ts=${Date.now()}`,'驗證資料'),
]).then(([d,g,v])=>{
  DATA=d; GAP=g; VERIFY=v;
  const verified=verificationMatches(DATA,GAP,VERIFY);
  if(!verified){
    GAP={...GAP,propertyGroups:[],comparisons:[],propertyGroupCount:0,rawListingCount:0,crossPlatformMergedGroupCount:0,counts:{company_match:0,review:0,missing:0,unavailable:0}};
  }
  CMAP=new Map((GAP.comparisons||[]).map(x=>[x.groupId,x]));
  render();
  if(!verified){
    for(const id of ['mGroups','mNew','mMerged','cStock','cReview','cMissing','cUnavailable']){
      const el=document.getElementById(id); if(el)el.textContent='—';
    }
    document.querySelector('#groups').innerHTML='<div class="empty">比對資料同步中。為避免把上一輪案件誤當成最新結果，案件清單暫停顯示。</div>';
    document.querySelector('#updated').textContent=`來源資料最近更新：${fmt(DATA.updatedAt)}｜公司比對資料同步中，完成後會自動恢復顯示。`;
  }
}).catch(e=>{
  console.error(e);
  document.querySelector('#updated').textContent='Preview 資料讀取失敗，請重新整理後再試。';
  document.querySelector('#groups').innerHTML='<div class="empty">目前無法完整載入監控資料，為避免顯示錯誤比對結果，案件列表已暫停顯示。</div>';
});
</script>
