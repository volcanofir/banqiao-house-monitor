name: 永慶樓層小批次 DOM 驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-floor-batch-test.yml"
      - "scripts/yungching_detail_floor_enrich.py"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-floor-batch-test
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install chromium
      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then exit 0; fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1
      - name: Run first 12 missing-floor details
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import yungching_detail_floor_enrich as f

          original = Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8')
          f.MAX_DETAIL_PAGES = 12
          f.main()
          snap = json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          diag = json.loads(Path('docs/preview/yungching-detail-floor.json').read_text(encoding='utf-8'))
          summary = {
              'detailFloorEnrichment': snap.get('detailFloorEnrichment'),
              'attempted': diag.get('attempted'),
              'enriched': diag.get('enriched'),
              'officialCaseIdEnriched': diag.get('officialCaseIdEnriched'),
              'rows': [
                  {
                      'id': x.get('id'), 'title': x.get('title'), 'http': x.get('http'),
                      'floor': x.get('floor'), 'mode': x.get('mode'),
                      'officialCaseId': x.get('officialCaseId'),
                      'domHasBasicInfo': x.get('domHasBasicInfo'),
                      'responseHasBasicInfo': x.get('responseHasBasicInfo'),
                  }
                  for x in (diag.get('rows') or [])
              ],
          }
          Path('docs/preview/yungching-floor-batch-test.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          Path('docs/preview/yungching-browser-snapshot.json').write_text(original,encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False))
          PY
      - if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save batch result
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/yungching-floor-batch-test.json /tmp/floor-batch.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/floor-batch.json docs/preview/yungching-floor-batch-test.json
          git add docs/preview/yungching-floor-batch-test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Yongching floor batch verification"
          git push origin HEAD:main
      - name: Assert useful floor coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/preview/yungching-floor-batch-test.json').read_text(encoding='utf-8'))
          assert x.get('attempted') == 12, x
          assert x.get('officialCaseIdEnriched',0) >= 6, x
          assert x.get('enriched',0) >= 6, x
          PY
