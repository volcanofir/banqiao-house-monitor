name: 價格歷史與介面修復

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-price-ui.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reset false price-change history
        run: python scripts/track_price_changes.py

      - name: Remove internal system time from listing UI
        run: python scripts/remove_first_seen_ui.py

      - name: Save repaired data and UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/index.html
          git diff --cached --quiet || git commit -m "Repair price tracking baseline and listing UI"
          git push
