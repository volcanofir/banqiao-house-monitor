# Legacy manual entry point only.  The Rakuya independent source is refreshed
# through monitor-clean's 3-hour per-source scheduler, not by repeatedly crawling
# Yongching and re-running the entire four-platform company comparison.
name: 樂屋七路段 Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rakuya-preview.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: banqiao-rakuya-manual-dispatch
  cancel-in-progress: true

jobs:
  dispatch-independent-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request independent Rakuya-only refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run preview-source-refresh.yml --repo "$GITHUB_REPOSITORY" --ref main -f source=rakuya
          echo "Independent Rakuya source refresh requested. No full Yongching crawl or canonical regroup."
