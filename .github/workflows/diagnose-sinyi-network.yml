name: 信義 Network API 診斷

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_sinyi_network.py"
      - ".github/workflows/diagnose-sinyi-network.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: pip install playwright

      - name: Diagnose Sinyi XHR and fetch APIs
        run: python scripts/diagnose_sinyi_network.py

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: sinyi-network-diagnostic
          path: docs/data/sinyi-network-diagnostic.json

      - name: Save diagnostic report to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sinyi-network-diagnostic.json
          git diff --cached --quiet || git commit -m "Update Sinyi network diagnostic"
          git pull --rebase
          git push
