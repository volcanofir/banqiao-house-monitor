name: 監控排程防漏

on:
  workflow_dispatch:
  schedule:
    # Independent fallback away from the top of the hour. It does no crawling itself.
    - cron: "23,53 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: banqiao-monitor-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check last full-check ATTEMPT (not last success)
        id: stale
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('state/monitor-schedule.json')
          raw = None
          if path.exists():
              try:
                  state = json.loads(path.read_text(encoding='utf-8'))
                  raw = (state.get('lastFullCheckAttemptAt')
                         or state.get('lastSuccessfulFullCheckAt'))
              except (OSError, ValueError):
                  pass
          age = None
          if raw:
              try:
                  stamp = datetime.fromisoformat(str(raw).replace('Z', '+00:00'))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=timezone.utc)
                  age = (datetime.now(timezone.utc) - stamp.astimezone(timezone.utc)).total_seconds() / 60
              except (TypeError, ValueError):
                  pass
          # Full-check retry cadence is 3 hours even when 591 or grouping fails.
          # The watchdog is a backstop for MISSED runs, not a failure retry loop.
          stale = age is None or age >= 210
          print(f'last full-check ATTEMPT age={age}; watchdog overdue={stale}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"stale={'true' if stale else 'false'}\n")
          PY

      - name: Wake main monitor when overdue, avoiding duplicates
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          active="$(gh run list --workflow monitor-clean.yml --limit 15 --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')"
          if [[ "$active" != "0" ]]; then
            echo "Full monitor already running or queued; skip duplicate watchdog dispatch."
            exit 0
          fi
          gh workflow run monitor-clean.yml --ref main
          echo "Missed full-check heartbeat recovered; last attempt was over 210 minutes ago."

      - name: Healthy cadence
        if: steps.stale.outputs.stale != 'true'
        run: echo "Recent full-check attempt is within the 210-minute watchdog window; no action needed."
