name: 永慶官方 DOM PREVIEW 快速驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview-fast.yml"
      - "scripts/yungching_dom_snapshot_v4.py"
      - "scripts/yungching_detail_floor_enrich.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/validate_scheme_a_preview.py"

permissions:
  contents: write

# Diagnostic only. Never writes canonical Preview files.
concurrency:
  group: banqiao-yungching-preview-fast-diagnostic
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 cryptography playwright
          python -m playwright install chromium

      - name: Connect Surfshark and verify Yongching Chromium
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then exit 0; fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Capture and sanitize official DOM
        run: python scripts/yungching_dom_snapshot_v4.py

      - name: Enrich official floors
        run: python scripts/yungching_detail_floor_enrich.py

      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Build comparison in diagnostic workspace
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v6.py 2>&1 | tee docs/preview/yungching-preview-run.log
          python scripts/patch_preview_ui.py
          python scripts/validate_scheme_a_preview.py

      - name: Write fast diagnostic verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          s=json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          out={
            'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'scheme':'A',
            'diagnosticOnly':True,
            'snapshotCapturedAt':s.get('capturedAt'),
            'companySnapshotCapturedAt':p.get('companySnapshotCapturedAt'),
            'fetchMode':p.get('fetchMode'),
            'browserListingCount':s.get('listingCount'),
            'companyListingCount':p.get('companyListingCount'),
            'propertyGroupCount':p.get('propertyGroupCount'),
            'rawListingCount':p.get('rawListingCount'),
            'comparisonCounts':p.get('counts'),
            'roadCounts':{r:(x or {}).get('count') for r,x in (s.get('roadStatus') or {}).items()},
            'idIntegrityGuard':s.get('idIntegrityGuard'),
            'detailFloorEnrichment':s.get('detailFloorEnrichment'),
            'legacyFallbacks':False,
            'passed':True,
          }
          Path('docs/preview/fast-verification.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Save fast diagnostic only
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/fast-verification.json /tmp/fast-verification.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/fast-verification.json docs/preview/fast-verification.json
          git add docs/preview/fast-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save scheme A fast diagnostic"
          git push origin HEAD:main

      - name: Save failed fast diagnostics separately
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-fast-failed
          [[ -f docs/preview/yungching-browser-snapshot.json ]] && cp docs/preview/yungching-browser-snapshot.json /tmp/yungching-fast-failed/yungching-browser-snapshot-fast-failed.json || true
          [[ -f docs/preview/yungching-detail-floor.json ]] && cp docs/preview/yungching-detail-floor.json /tmp/yungching-fast-failed/yungching-detail-floor-fast-failed.json || true
          [[ -f docs/preview/yungching-preview-run.log ]] && cp docs/preview/yungching-preview-run.log /tmp/yungching-fast-failed/yungching-preview-run-fast-failed.log || true
          git fetch origin main
          git reset --hard origin/main
          for f in /tmp/yungching-fast-failed/*; do
            [[ -e "$f" ]] || continue
            cp "$f" "docs/preview/$(basename "$f")"
          done
          git add docs/preview/*-fast-failed.json docs/preview/*-fast-failed.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save failed fast scheme A diagnostics separately"
            git push origin HEAD:main || true
          fi
