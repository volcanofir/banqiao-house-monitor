name: 永慶官方 DOM PREVIEW 快速驗證

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview-fast.yml"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-preview-fast
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 cryptography playwright
          python -m playwright install chromium

      - name: Connect Surfshark and verify Yongching Chromium
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Surfshark Yongching fast attempt $attempt/5"
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh; then
              if python scripts/yungching_browser_preflight.py; then
                echo "Surfshark exit accepted by Yongching Chromium."
                exit 0
              fi
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          echo "No usable Surfshark exit found."
          exit 1

      - name: Capture rendered Yongching result cards
        shell: bash
        run: python scripts/yungching_dom_snapshot_v2.py

      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        shell: bash
        run: sudo wg-quick down surfshark || true

      - name: Build Preview company comparison from official DOM only
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v6.py 2>&1 | tee docs/preview/yungching-preview-run.log

      - name: Patch Preview UI
        run: python scripts/patch_preview_ui.py

      - name: Assert official rendered source reached Preview
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          snap = json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          assert p.get('fetchMode') == 'yungching_official_rendered_dom_only', p.get('fetchMode')
          stats = p.get('officialBrowserCompany') or {}
          assert stats.get('acceptedRoadCount', 0) > 0, stats
          assert p.get('companyListingCount', 0) > 0, p.get('companyListingCount')

          result = {
              'verifiedAt': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'fetchMode': p.get('fetchMode'),
              'companyDataSource': p.get('companyDataSource'),
              'companyListingCount': p.get('companyListingCount'),
              'acceptedRoadCount': stats.get('acceptedRoadCount'),
              'unavailableRoadCount': stats.get('unavailableRoadCount'),
              'comparisonCounts': p.get('counts'),
              'browserListingCount': snap.get('listingCount'),
              'roadStatus': snap.get('roadStatus'),
          }
          Path('docs/preview/fast-verification.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Save verified Preview output
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/yungching-preview-verified
          cp docs/preview/company-gap.json /tmp/yungching-preview-verified/company-gap.json
          cp docs/preview/yungching-preview-run.log /tmp/yungching-preview-verified/yungching-preview-run.log
          cp docs/preview/yungching-browser-snapshot.json /tmp/yungching-preview-verified/yungching-browser-snapshot.json
          cp docs/preview/fast-verification.json /tmp/yungching-preview-verified/fast-verification.json
          cp docs/preview/index.html /tmp/yungching-preview-verified/index.html

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/yungching-preview-verified/company-gap.json docs/preview/company-gap.json
            cp /tmp/yungching-preview-verified/yungching-preview-run.log docs/preview/yungching-preview-run.log
            cp /tmp/yungching-preview-verified/yungching-browser-snapshot.json docs/preview/yungching-browser-snapshot.json
            cp /tmp/yungching-preview-verified/fast-verification.json docs/preview/fast-verification.json
            cp /tmp/yungching-preview-verified/index.html docs/preview/index.html
            git add \
              docs/preview/company-gap.json \
              docs/preview/yungching-preview-run.log \
              docs/preview/yungching-browser-snapshot.json \
              docs/preview/fast-verification.json \
              docs/preview/index.html
            if git diff --cached --quiet; then
              echo "Verified Preview already matches main."
              exit 0
            fi
            git commit -m "Update verified Yongching DOM Preview"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
