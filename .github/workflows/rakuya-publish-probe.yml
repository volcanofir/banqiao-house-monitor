name: Rakuya publish-date probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rakuya-publish-probe.yml"

permissions:
  contents: write

concurrency:
  group: rakuya-publish-probe
  cancel-in-progress: true

jobs:
  verify-source-dates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Refresh Rakuya with true source upload dates
        run: |
          python scripts/fetch_rakuya_seven_roads_preview.py
          python scripts/validate_rakuya_preview_snapshot.py
      - name: Save verified Rakuya snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/rakuya-seven-roads.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Rakuya true upload dates"
          git pull --rebase
          git push
