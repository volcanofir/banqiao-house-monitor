name: Rakuya publish-date probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rakuya-publish-probe.yml"
      - "scripts/rakuya_publish_probe.py"

permissions:
  contents: write

concurrency:
  group: rakuya-publish-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright
      - name: Inspect rendered Rakuya detail
        run: python scripts/run_with_system_chrome.py scripts/rakuya_publish_probe.py
      - name: Save diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/rakuya-publish-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Rakuya publish-date probe"
          git pull --rebase
          git push
