name: 591 獨立 Session 測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/591-independent-session-test.yml"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
      - name: Test seven independent 591 sessions
        run: PYTHONPATH=scripts python scripts/test_591_independent_sessions.py
      - name: Save report only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/591-independent-session-test.json
          git diff --cached --quiet || git commit -m "Update 591 independent session test report"
          git push
