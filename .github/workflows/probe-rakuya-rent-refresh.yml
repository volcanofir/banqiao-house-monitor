name: Probe Rakuya rental data endpoint (diagnostic)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-rakuya-rent-refresh.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Inspect embedded rentSearch payload pages (read-only)
        run: |
          python - <<'PY'
          import json,re,requests
          from urllib.parse import urlencode
          for road,page in [('三民路二段',1),('中山路二段',1),('中山路二段',2),('翠華街',1)]:
            url='https://rent.rakuya.com.tw/result?'+urlencode({'zipcode':'220','keyword':road,'page':page})
            try:
              r=requests.get(url,timeout=20,headers={'User-Agent':'Mozilla/5.0','Accept-Language':'zh-TW,zh;q=0.9'})
              m=re.search(r'window\.rentSearch\s*=\s*',r.text)
              if not m:
                print('ROAD',road,page,'HTTP',r.status_code,'rentSearch missing');continue
              obj,end=json.JSONDecoder().raw_decode(r.text[m.end():])
              print('ROAD',road,page,'HTTP',r.status_code,'KEYS',list(obj.keys()))
              for k,v in obj.items():
                if isinstance(v,dict):
                  print('DICT',k,'KEYS',list(v.keys())[:35])
                  if 'pagination' in k.lower() or 'list' in k.lower(): print('DICT_DETAIL',k,json.dumps(v,ensure_ascii=False)[:700])
                if isinstance(v,list):
                  print('LIST',k,'COUNT',len(v),'SAMPLE',json.dumps(v[:1],ensure_ascii=False)[:1700])
              print('PAGINATION',json.dumps(obj.get('pagination'),ensure_ascii=False))
            except Exception as e:print('ERROR',road,page,type(e).__name__,str(e)[:250])
          PY
