name: Probe Rakuya rental data endpoint (diagnostic)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/probe-rakuya-rent-refresh.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 playwright curl_cffi
      - name: Test new parser across all seven rental roads without publishing
        run: |
          python - <<'PY'
          import importlib.util,json
          spec=importlib.util.spec_from_file_location('fetch_rental_preview','scripts/fetch_rental_preview.py')
          mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          rows,ok,logs=mod.fetch_rakuya_http()
          print('RAKUYA_RESULT',json.dumps({'ok':ok,'total':len(rows),'roads':{road:sum(1 for item in rows if item['road']==road) for road in mod.WATCH_ROADS}},ensure_ascii=False))
          for log in logs:print('RAKUYA_LOG',log)
          assert ok,'Seven roads were not all verified'
          assert rows,'No rental results returned'
          assert all(r['url'].startswith('https://') and r['houseId'] for r in rows),'Malformed result'
          PY
