name: 591 Playwright 診斷

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_591_playwright.py"
      - ".github/workflows/diagnose-591.yml"

permissions:
  contents: write

concurrency:
  group: diagnose-591-playwright
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run 591 browser diagnostic
        run: python scripts/diagnose_591_playwright.py

      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/591-playwright-diagnostic.json
          git diff --cached --quiet || git commit -m "Update 591 Playwright diagnostic [skip ci]"
          git push
