name: 永慶第二頁 pg 參數獨立測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-pagination-v4-test.yml"
      - "scripts/yungching_dom_snapshot_v4.py"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-pagination-v4-test
  cancel-in-progress: true

jobs:
  pagination-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Chromium dependencies
        run: |
          pip install playwright requests beautifulsoup4 cryptography
          python -m playwright install chromium

      - name: Connect Surfshark accepted by Yongching
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Capture with direct pg pagination
        run: python scripts/yungching_dom_snapshot_v4.py

      - name: Assert page 2 is real and merged
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          snap = json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          st = (snap.get('roadStatus') or {}).get('板橋區中山路二段') or {}
          clicks = st.get('nextClicks') or []
          direct = [x for x in clicks if x.get('mode') == 'yungching-direct-pg-v4' and int(x.get('target') or 0) == 2]

          assert st.get('mainHttp') == 200, st
          assert st.get('available') is True, st
          assert st.get('paginationExpected') is True, st
          assert st.get('paginationComplete') is True, st
          assert int(st.get('paginationActivePage') or 0) >= 2, st
          assert int(st.get('pageRounds') or 0) >= 1, st
          assert int(st.get('count') or 0) >= 39, st
          assert direct, clicks
          assert direct[0].get('http') == 200, direct[0]
          assert direct[0].get('activeVerified') is True, direct[0]
          assert 'pg=2' in str(direct[0].get('finalUrl') or direct[0].get('targetUrl') or ''), direct[0]

          result = {
              'verifiedAt': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'road': '板橋區中山路二段',
              'count': st.get('count'),
              'pageRounds': st.get('pageRounds'),
              'paginationActivePage': st.get('paginationActivePage'),
              'paginationComplete': st.get('paginationComplete'),
              'directPg2': direct[0],
              'listingCountAllRoads': snap.get('listingCount'),
          }
          Path('docs/preview/yungching-pagination-v4-test.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Save successful pagination test
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-pg-test
          cp docs/preview/yungching-pagination-v4-test.json /tmp/yungching-pg-test/result.json
          cp docs/preview/yungching-browser-snapshot.json /tmp/yungching-pg-test/snapshot.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/yungching-pg-test/result.json docs/preview/yungching-pagination-v4-test.json
          cp /tmp/yungching-pg-test/snapshot.json docs/preview/yungching-browser-snapshot.json
          git add docs/preview/yungching-pagination-v4-test.json docs/preview/yungching-browser-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save verified Yongching pg pagination test"
          git push origin HEAD:main
