name: 方案 A 81筆清洗快照重播 Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheme-a-failed-snapshot-replay.yml"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/compare_yungching_preview_v7.py"
      - "scripts/validate_scheme_a_preview.py"
      - "docs/data/listings.json"
      - "docs/preview/yungching-browser-snapshot-failed.json"

permissions:
  contents: write

concurrency:
  group: banqiao-scheme-a-81-replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Replay latest matcher on cleaned official snapshot
        shell: bash
        run: |
          cp docs/preview/yungching-browser-snapshot-failed.json docs/preview/yungching-browser-snapshot.json
          python scripts/compare_yungching_preview_v7.py > /tmp/replay.log 2>&1
          python - <<'PY'
          import json,sys,traceback
          from datetime import datetime,timezone
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import validate_scheme_a_preview as v
          v.FORBIDDEN_MODES=("har_fallback","yungching_har","housefun","proxy","previous_snapshot","previous-snapshot")
          p=json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          s=json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          out={
            'auditedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'passed':False,
            'error':None,
            'browserListingCount':s.get('listingCount'),
            'companyListingCount':p.get('companyListingCount'),
            'propertyGroupCount':p.get('propertyGroupCount'),
            'rawListingCount':p.get('rawListingCount'),
            'counts':p.get('counts'),
            'preview591Regroup':p.get('preview591Regroup'),
            'schemeAGroupIntegrity':p.get('schemeAGroupIntegrity'),
            'safeFloorParser':p.get('safeFloorParser'),
            'companyCandidateReuseGuard':p.get('companyCandidateReuseGuard'),
          }
          try:
            v.main()
            out['passed']=True
          except Exception as exc:
            out['error']=f'{type(exc).__name__}: {exc}'
            out['traceTail']=traceback.format_exc().splitlines()[-10:]
          out['runLog']=Path('/tmp/replay.log').read_text(encoding='utf-8')[-8000:]
          Path('docs/preview/scheme-a-81-replay-audit.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Save replay audit only
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/scheme-a-81-replay-audit.json /tmp/audit.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/audit.json docs/preview/scheme-a-81-replay-audit.json
          git add docs/preview/scheme-a-81-replay-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save scheme A 81 snapshot replay audit"
          git push origin HEAD:main
