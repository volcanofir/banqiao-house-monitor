name: 591 shared warmup probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_591_shared_warmup.py"
      - ".github/workflows/probe-591-shared-warmup.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh

      - name: Run shared warmup comparison
        run: python scripts/probe_591_shared_warmup.py

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 591-shared-warmup-report
          path: artifacts/591-shared-warmup-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Disconnect Surfshark
        if: always()
        run: sudo wg-quick down surfshark || true
