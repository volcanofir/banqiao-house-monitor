name: 板橋房屋監控

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monitor_pages.py"
      - "docs/**"
      - ".github/workflows/monitor.yml"
  schedule:
    # Asia/Taipei 00:00 / 03:00 / 06:00 / 09:00 / 12:00 / 15:00 / 18:00 / 21:00
    - cron: "0 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

concurrency:
  group: banqiao-house-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor packages
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Fetch Banqiao listings
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor_pages.py

      - name: Save latest data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet || git commit -m "Update monitored listings [skip ci]"
          git push
