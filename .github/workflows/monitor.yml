name: 板橋房屋監控與 GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monitor_pages.py"
      - "docs/**"
      - ".github/workflows/monitor.yml"
  schedule:
    # Asia/Taipei 00:00 / 03:00 / 06:00 / 09:00 / 12:00 / 15:00 / 18:00 / 21:00
    - cron: "0 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: banqiao-house-pages
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install monitor packages
        run: pip install requests beautifulsoup4

      - name: Fetch Banqiao listings
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor_pages.py

      - name: Save latest data to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json
          git diff --cached --quiet || git commit -m "Update monitored listings [skip ci]"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
