name: 修復 iPhone 主畫面

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-icon-head.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build installable web app icons
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          rsvg-convert -w 180 -h 180 docs/icon-safe.svg -o docs/icon-safe-180.png
          rsvg-convert -w 192 -h 192 docs/icon-safe.svg -o docs/icon-safe-192.png
          rsvg-convert -w 512 -h 512 docs/icon-safe.svg -o docs/icon-safe-512.png
          rsvg-convert -w 32 -h 32 docs/icon-safe.svg -o docs/icon-safe-32.png
          convert docs/icon-safe-32.png docs/favicon.ico

      - name: Create web app manifest
        shell: bash
        run: |
          cat > docs/manifest.webmanifest <<'EOF'
          {
            "name": "板橋新案監控",
            "short_name": "板橋新案監控",
            "description": "板橋指定路段房屋新案監控",
            "start_url": "/banqiao-house-monitor/",
            "scope": "/banqiao-house-monitor/",
            "display": "standalone",
            "background_color": "#fff8df",
            "theme_color": "#f5d331",
            "icons": [
              {
                "src": "/banqiao-house-monitor/icon-safe-192.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
              },
              {
                "src": "/banqiao-house-monitor/icon-safe-512.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
              }
            ]
          }
          EOF

      - name: Apply manifest and icon references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove every old manifest/icon/share-image reference so Safari cannot
          # fall back to the previously broken asset.
          s = re.sub(r'^\s*<link rel="(?:apple-touch-icon|apple-touch-icon-precomposed|icon|shortcut icon|manifest)"[^>]*>\s*\n?', '', s, flags=re.MULTILINE)
          s = re.sub(r'^\s*<meta property="og:image"[^>]*>\s*\n?', '', s, flags=re.MULTILINE)
          s = re.sub(r'^\s*<meta name="mobile-web-app-capable"[^>]*>\s*\n?', '', s, flags=re.MULTILINE)

          marker = '  <meta name="application-name" content="板橋新案監控" />\n'
          block = '''  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/banqiao-house-monitor/manifest.webmanifest?v=202608211252" />
  <link rel="apple-touch-icon" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211252" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211252" />
  <link rel="icon" type="image/png" sizes="32x32" href="/banqiao-house-monitor/icon-safe-32.png?v=202608211252" />
  <link rel="shortcut icon" href="/banqiao-house-monitor/favicon.ico?v=202608211252" />
  <meta property="og:image" content="https://volcanofir.github.io/banqiao-house-monitor/icon-safe-512.png?v=202608211252" />
'''
          if marker not in s:
              raise SystemExit('application-name marker not found')
          s = s.replace(marker, marker + block, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit iPhone install fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/manifest.webmanifest docs/icon-safe-180.png docs/icon-safe-192.png docs/icon-safe-512.png docs/icon-safe-32.png docs/favicon.ico
          git diff --cached --quiet || git commit -m "Fix iPhone home screen install"
          git pull --rebase
          git push
