name: Houseprice rent service probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_houseprice_rent_service.py"
      - ".github/workflows/probe-houseprice-rent-service.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_houseprice_rent_service.py
