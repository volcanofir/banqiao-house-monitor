name: Sinyi response probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_sinyi_response.py"
      - ".github/workflows/probe-sinyi-response.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_sinyi_response.py
