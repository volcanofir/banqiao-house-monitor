name: 信義板橋 16 店相對店資料

on:
  workflow_dispatch:
  schedule:
    # Primary cadence: every 3 hours. monitor-clean.yml also dispatches this workflow
    # when the published competitor snapshot is 4+ hours stale.
    - cron: "25 */3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/r420-preview.yml"
      - "scripts/fetch_sinyi_banqiao_stores.py"
      - "scripts/enrich_sinyi_company_first_display.py"
      - "docs/company/index.html"
      - "docs/Sy-bq/index.html"

permissions:
  contents: write
  pages: write

concurrency:
  group: sinyi-banqiao-company
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 playwright

      - name: Fetch all 16 Sinyi stores
        run: python scripts/fetch_sinyi_banqiao_stores.py

      - name: Enrich original Sinyi publish times
        run: python scripts/enrich_sinyi_company_first_display.py

      - name: Validate complete snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/company/sinyi-banqiao-stores.json').read_text(encoding='utf-8'))
          assert d['storeCount'] == 16
          assert d['healthyStoreCount'] == 16, d.get('failures')
          assert not d.get('failures'), d.get('failures')
          assert all(x.get('status') == 'ok' for x in d['stores'])
          assert all(int(x.get('totalCount') or 0) == int(x.get('sourceTotalCount') or 0) for x in d['stores'])
          print('validated', d['totalStoreListings'], 'store-listings', d['uniquePropertyCount'], 'unique properties')
          print('firstDisplay', d.get('firstDisplayResolved',0), '/', d.get('firstDisplayTotal',0), 'missing', d.get('firstDisplayMissing',0))
          PY

      - name: Publish competitor dataset
        shell: bash
        run: |
          set -e
          cp docs/company/sinyi-banqiao-stores.json /tmp/sinyi-banqiao-stores.json
          cp docs/data/sinyi-first-display-cache.json /tmp/sinyi-first-display-cache.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/sinyi-banqiao-stores.json docs/company/sinyi-banqiao-stores.json
          cp /tmp/sinyi-first-display-cache.json docs/data/sinyi-first-display-cache.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/company/sinyi-banqiao-stores.json docs/data/sinyi-first-display-cache.json
          if git diff --cached --quiet; then
            echo "Competitor data already current."
            exit 0
          fi
          git commit -m "Update 16-store Sinyi competitor data"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"
