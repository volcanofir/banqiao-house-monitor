name: 永慶公司案件比對 PREVIEW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview.yml"
      - "scripts/compare_yungching_preview_v2.py"
      - "scripts/compare_yungching_preview_v3.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/compare_yungching_preview_v7.py"
      - "scripts/yungching_crypto.py"
      - "scripts/yungching_official_probe.py"
      - "scripts/yungching_playwright_probe.py"
      - "scripts/yungching_dom_snapshot.py"
      - "scripts/yungching_dom_snapshot_v2.py"
      - "scripts/yungching_dom_snapshot_v3.py"
      - "scripts/yungching_dom_snapshot_v4.py"
      - "scripts/yungching_dom_snapshot_v5.py"
      - "scripts/yungching_detail_floor_enrich.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/connect_surfshark_wireguard.sh"
      - "scripts/patch_preview_ui.py"
      - "scripts/validate_scheme_a_preview.py"
      - "scripts/validate_scheme_a_preview_v2.py"
      - "docs/data/listings.json"

permissions:
  contents: write

concurrency:
  group: banqiao-scheme-a-preview-canonical
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 cryptography playwright
          python -m playwright install chromium

      - name: Find usable Surfshark exit for Yongching
        id: vpn
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Surfshark Yongching attempt $attempt/5"
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then
              echo "Found Surfshark exit accepted by Yongching Chromium."
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 4
          done
          exit 1

      - name: Probe official Yongching source
        continue-on-error: true
        env:
          YUNGCHING_PROBE_VPN_OUTCOME: ${{ steps.vpn.outcome }}
        shell: bash
        run: |
          python scripts/yungching_crypto.py --self-test
          python scripts/yungching_official_probe.py
          python scripts/yungching_playwright_probe.py
          python scripts/yungching_page_param_probe.py

      - name: Extract official DOM through the actual last page and sanitize IDs
        shell: bash
        run: python scripts/yungching_dom_snapshot_v5.py

      - name: Enrich missing floors from official detail DOM
        run: python scripts/yungching_detail_floor_enrich.py

      - name: Disconnect Surfshark before Preview comparison
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Regroup 591, merge into Sinyi, then compare official Yongching DOM
        id: compare
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v7.py 2>&1 | tee docs/preview/yungching-preview-run.log

      - name: Simplify Preview UI and run hard scheme A validator
        run: python scripts/patch_preview_ui.py

      - name: Validate scheme A again before manifest
        run: python scripts/validate_scheme_a_preview_v2.py

      - name: Write canonical scheme A verification manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          s=json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          comparisons=p.get('comparisons') or []
          candidates=[x.get('companyCandidate') for x in comparisons if x.get('companyCandidate')]
          manifest={
            'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'scheme':'A',
            'integrityVersion':'scheme-a-canonical-v2-all-pages-safe-floor',
            'source':'Surfshark + Chromium official Yongching DOM + all-pages direct pg pagination + official detail pages',
            'fetchMode':p.get('fetchMode'),
            'safeFloorParser':p.get('safeFloorParser'),
            'snapshotCapturedAt':s.get('capturedAt'),
            'companySnapshotCapturedAt':p.get('companySnapshotCapturedAt'),
            'companyGapGeneratedAt':p.get('generatedAt'),
            'browserListingCount':s.get('listingCount'),
            'companyListingCount':p.get('companyListingCount'),
            'propertyGroupCount':p.get('propertyGroupCount'),
            'rawListingCount':p.get('rawListingCount'),
            'comparisonCount':len(comparisons),
            'coveredRoads':p.get('coveredRoads'),
            'roadCounts':{r:(st or {}).get('count') for r,st in (s.get('roadStatus') or {}).items()},
            'pagination':{r:{
                'expected':(st or {}).get('paginationExpected'),
                'lastPage':(st or {}).get('paginationLastPage'),
                'exhausted':(st or {}).get('paginationExhausted'),
                'completeAllPages':(st or {}).get('paginationCompleteAllPages'),
            } for r,st in (s.get('roadStatus') or {}).items()},
            'counts':p.get('counts'),
            'crossPlatformMergedGroupCount':p.get('crossPlatformMergedGroupCount'),
            'crossSourceReviewCount':p.get('crossSourceReviewCount'),
            'preview591Regroup':p.get('preview591Regroup'),
            'schemeAGroupIntegrity':p.get('schemeAGroupIntegrity'),
            'idIntegrityGuard':s.get('idIntegrityGuard'),
            'candidateCount':len(candidates),
            'candidatesWithFloor':sum(1 for x in candidates if x.get('floor')),
            'candidatesWithYcCaseId':sum(1 for x in candidates if x.get('officialCaseId')),
            'detailFloorEnrichment':s.get('detailFloorEnrichment'),
            'legacyFallbacks':False,
            'canonicalPublisher':'yungching-preview.yml',
            'valid':True,
          }
          assert manifest['safeFloorParser'] is True, manifest
          assert manifest['snapshotCapturedAt'] == manifest['companySnapshotCapturedAt'], manifest
          assert manifest['browserListingCount'] == manifest['companyListingCount'], manifest
          assert manifest['propertyGroupCount'] == manifest['comparisonCount'], manifest
          assert all(x.get('completeAllPages') is True and x.get('exhausted') is True for x in manifest['pagination'].values()), manifest['pagination']
          Path('docs/preview/scheme-a-verification.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Save verified canonical Preview output
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-output
          for f in company-gap.json yungching-preview-run.log yungching-official-probe.json yungching-official-snapshot.json yungching-playwright-probe.json yungching-browser-snapshot.json yungching-detail-floor.json yungching-pagination-probe.json scheme-a-verification.json index.html; do
            if [[ -f docs/preview/$f ]]; then cp docs/preview/$f /tmp/yungching-preview-output/$f; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in /tmp/yungching-preview-output/*; do
            [[ -e "$f" ]] || continue
            cp "$f" "docs/preview/$(basename "$f")"
          done
          for f in company-gap.json yungching-preview-run.log yungching-official-probe.json yungching-official-snapshot.json yungching-playwright-probe.json yungching-browser-snapshot.json yungching-detail-floor.json yungching-pagination-probe.json scheme-a-verification.json index.html; do
            [[ -f docs/preview/$f ]] && git add "docs/preview/$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish canonical verified scheme A Preview"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Save failed scheme A diagnostics separately
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-failed
          [[ -f docs/preview/yungching-preview-run.log ]] && cp docs/preview/yungching-preview-run.log /tmp/yungching-preview-failed/yungching-preview-run-failed.log || true
          [[ -f docs/preview/company-gap.json ]] && cp docs/preview/company-gap.json /tmp/yungching-preview-failed/company-gap-failed.json || true
          [[ -f docs/preview/yungching-official-probe.json ]] && cp docs/preview/yungching-official-probe.json /tmp/yungching-preview-failed/yungching-official-probe-failed.json || true
          [[ -f docs/preview/yungching-official-snapshot.json ]] && cp docs/preview/yungching-official-snapshot.json /tmp/yungching-preview-failed/yungching-official-snapshot-failed.json || true
          [[ -f docs/preview/yungching-playwright-probe.json ]] && cp docs/preview/yungching-playwright-probe.json /tmp/yungching-preview-failed/yungching-playwright-probe-failed.json || true
          [[ -f docs/preview/yungching-browser-snapshot.json ]] && cp docs/preview/yungching-browser-snapshot.json /tmp/yungching-preview-failed/yungching-browser-snapshot-failed.json || true
          [[ -f docs/preview/yungching-detail-floor.json ]] && cp docs/preview/yungching-detail-floor.json /tmp/yungching-preview-failed/yungching-detail-floor-failed.json || true
          [[ -f docs/preview/yungching-pagination-probe.json ]] && cp docs/preview/yungching-pagination-probe.json /tmp/yungching-preview-failed/yungching-pagination-probe-failed.json || true

          git fetch origin main
          git reset --hard origin/main
          for f in /tmp/yungching-preview-failed/*; do
            [[ -e "$f" ]] || continue
            cp "$f" "docs/preview/$(basename "$f")"
          done
          git add docs/preview/*-failed.json docs/preview/*-failed.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Save failed scheme A diagnostics separately"
            git push origin HEAD:main || true
          fi
