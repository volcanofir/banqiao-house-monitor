name: 永慶公司案件比對 PREVIEW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview.yml"
      - "scripts/compare_yungching_preview_v2.py"
      - "scripts/compare_yungching_preview_v3.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/yungching_crypto.py"
      - "scripts/yungching_official_probe.py"
      - "scripts/yungching_playwright_probe.py"
      - "scripts/yungching_dom_snapshot.py"
      - "scripts/yungching_dom_snapshot_v2.py"
      - "scripts/yungching_dom_snapshot_v3.py"
      - "scripts/yungching_dom_snapshot_v4.py"
      - "scripts/yungching_detail_floor_enrich.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/connect_surfshark_wireguard.sh"
      - "scripts/patch_preview_ui.py"
      - "docs/data/listings.json"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-preview
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 cryptography playwright
          python -m playwright install chromium

      - name: Find usable Surfshark exit for Yongching
        id: vpn
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Surfshark Yongching attempt $attempt/5"
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then
              echo "Found Surfshark exit accepted by Yongching Chromium."
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 4
          done
          exit 1

      - name: Probe official Yongching source
        continue-on-error: true
        env:
          YUNGCHING_PROBE_VPN_OUTCOME: ${{ steps.vpn.outcome }}
        shell: bash
        run: |
          python scripts/yungching_crypto.py --self-test
          python scripts/yungching_official_probe.py
          python scripts/yungching_playwright_probe.py
          python scripts/yungching_page_param_probe.py

      - name: Extract official rendered DOM with direct pg pagination
        shell: bash
        run: python scripts/yungching_dom_snapshot_v4.py

      - name: Enrich missing floors from official detail DOM
        continue-on-error: true
        run: python scripts/yungching_detail_floor_enrich.py

      - name: Disconnect Surfshark before Preview comparison
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Regroup 591, merge into Sinyi, then compare official Yongching DOM
        id: compare
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v6.py 2>&1 | tee docs/preview/yungching-preview-run.log

      - name: Simplify Preview UI
        run: python scripts/patch_preview_ui.py

      - name: Validate scheme A source chain
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          s = json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          assert p.get('fetchMode') == 'yungching_official_rendered_dom_only', p.get('fetchMode')
          assert (p.get('companyDataGuard') or {}).get('enabled') is False
          bad = []
          for road, st in (p.get('roadStatus') or {}).items():
              mode = str((st or {}).get('mode') or '').lower()
              if any(x in mode for x in ('har','housefun','proxy','previous_snapshot')):
                  bad.append((road, mode))
          assert not bad, bad
          assert all(x.get('sourceMode') == 'yungching_official_browser' for x in (p.get('companyListings') or []))

          z = (s.get('roadStatus') or {}).get('板橋區中山路二段') or {}
          direct = [x for x in (z.get('nextClicks') or []) if x.get('mode') == 'yungching-direct-pg-v4' and int(x.get('target') or 0) == 2]
          assert z.get('paginationComplete') is True, z
          assert int(z.get('count') or 0) >= 39, z
          assert direct and direct[0].get('http') == 200 and direct[0].get('activeVerified') is True, direct
          print(json.dumps({'scheme':'A','zhongshanCount':z.get('count'),'companyListingCount':p.get('companyListingCount'),'counts':p.get('counts')}, ensure_ascii=False))
          PY

      - name: Save verified Preview output
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-output
          for f in company-gap.json yungching-preview-run.log yungching-official-probe.json yungching-official-snapshot.json yungching-playwright-probe.json yungching-browser-snapshot.json yungching-detail-floor.json yungching-pagination-probe.json index.html; do
            if [[ -f docs/preview/$f ]]; then cp docs/preview/$f /tmp/yungching-preview-output/$f; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in company-gap.json yungching-preview-run.log yungching-official-probe.json yungching-official-snapshot.json yungching-playwright-probe.json yungching-browser-snapshot.json yungching-detail-floor.json yungching-pagination-probe.json index.html; do
            if [[ -f /tmp/yungching-preview-output/$f ]]; then cp /tmp/yungching-preview-output/$f docs/preview/$f; fi
          done
          git add docs/preview || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update verified scheme A Preview"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Save failed scheme A diagnostics only
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-failed
          for f in yungching-preview-run.log yungching-official-probe.json yungching-official-snapshot.json yungching-playwright-probe.json yungching-browser-snapshot.json yungching-detail-floor.json yungching-pagination-probe.json; do
            if [[ -f docs/preview/$f ]]; then cp docs/preview/$f /tmp/yungching-preview-failed/$f; fi
          done
          git fetch origin main
          git reset --hard origin/main
          for f in yungching-preview-run.log yungching-official-probe.json yungching-official-snapshot.json yungching-playwright-probe.json yungching-browser-snapshot.json yungching-detail-floor.json yungching-pagination-probe.json; do
            if [[ -f /tmp/yungching-preview-failed/$f ]]; then cp /tmp/yungching-preview-failed/$f docs/preview/$f; fi
          done
          git add docs/preview || true
          if ! git diff --cached --quiet; then
            git commit -m "Save failed scheme A diagnostics"
            git push origin HEAD:main || true
          fi
