name: 永慶公司案件比對 PREVIEW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview.yml"
      - "scripts/compare_yungching_preview_v2.py"
      - "scripts/compare_yungching_preview_v3.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/patch_preview_ui.py"
      - "docs/data/listings.json"
      - "docs/preview/yungching-har-snapshot.json"
      - "docs/preview/yungching-area-enrichment.json"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-preview
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Regroup 591, merge into Sinyi, then floor-aware company compare
        id: compare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v5.py 2>&1 | tee docs/preview/yungching-preview-run.log

      - name: Simplify preview UI copy
        if: always()
        run: python scripts/patch_preview_ui.py

      - name: Save preview comparison and diagnostic
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/company-gap.json docs/preview/yungching-preview-run.log docs/preview/index.html || true
          if git diff --cached --quiet; then
            echo "No preview comparison changes."
            exit 0
          fi
          git commit -m "Update Yongching preview comparison"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Fail if comparison failed
        if: steps.compare.outcome != 'success'
        run: exit 1
