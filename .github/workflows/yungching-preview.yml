# Stable baseline verification trigger: clean-state run after repository cleanup.
name: 永慶公司案件比對 PREVIEW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview.yml"
      - "scripts/compare_yungching_preview.py"
      - "scripts/compare_yungching_preview_v2.py"
      - "scripts/compare_yungching_preview_v3.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/compare_yungching_preview_v7.py"
      - "scripts/compare_yungching_preview_v8.py"
      - "scripts/sinyi_preview_floor_enrich.py"
      - "scripts/audit_scheme_a_ambiguity.py"
      - "scripts/audit_scheme_a_ambiguity_v2.py"
      - "scripts/yungching_dom_snapshot.py"
      - "scripts/yungching_dom_snapshot_v2.py"
      - "scripts/yungching_dom_snapshot_v3.py"
      - "scripts/yungching_dom_snapshot_v4.py"
      - "scripts/yungching_dom_snapshot_v5.py"
      - "scripts/yungching_detail_floor_enrich.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/connect_surfshark_wireguard.sh"
      - "scripts/patch_preview_ui.py"
      - "scripts/smoke_test_preview_ui.py"
      - "scripts/validate_scheme_a_preview.py"
      - "scripts/validate_scheme_a_preview_v2.py"
      - "scripts/validate_scheme_a_preview_v3.py"
      - "scripts/write_scheme_a_saved_output_audit.py"
      - "docs/data/listings.json"

permissions:
  contents: write

concurrency:
  group: banqiao-scheme-a-preview-canonical
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 cryptography playwright
          python -m playwright install chromium

      - name: Find usable Surfshark exit for Yongching
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Surfshark Yongching attempt $attempt/5"
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then
              echo "Found Surfshark exit accepted by Yongching Chromium."
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 4
          done
          exit 1

      - name: Extract official DOM through the actual last page and sanitize IDs
        shell: bash
        run: python scripts/yungching_dom_snapshot_v5.py

      - name: Enrich missing floors from official detail DOM
        run: python scripts/yungching_detail_floor_enrich.py

      - name: Disconnect Surfshark before Preview comparison
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Build Preview-only Sinyi structured floor snapshot
        shell: bash
        run: python scripts/sinyi_preview_floor_enrich.py

      - name: Regroup 591, merge with structured Sinyi floors, then compare Yongching
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v8.py 2>&1 | tee docs/preview/yungching-preview-run.log

      - name: Harden Preview UI and validate scheme A
        run: python scripts/patch_preview_ui.py

      - name: Validate scheme A v3 again before audit and manifest
        run: python scripts/validate_scheme_a_preview_v3.py

      - name: Re-run ambiguity audit with structured floors
        run: python scripts/audit_scheme_a_ambiguity_v2.py

      - name: Write canonical scheme A verification manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          s=json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          sf=json.loads(Path('docs/preview/sinyi-floor-enrichment.json').read_text(encoding='utf-8'))
          aa=json.loads(Path('docs/preview/scheme-a-ambiguity-audit.json').read_text(encoding='utf-8'))
          d=json.loads(Path('docs/data/listings.json').read_text(encoding='utf-8'))
          comparisons=p.get('comparisons') or []
          candidates=[x.get('companyCandidate') for x in comparisons if x.get('companyCandidate')]
          near=p.get('companyNearTieGuard') or {}
          manifest={
            'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'scheme':'A',
            'integrityVersion':'scheme-a-canonical-v3-sinyi-floor-neartie',
            'source':'Sinyi official __NEXT_DATA__ structured floors + Surfshark + Chromium official Yongching DOM + all-pages direct pg pagination + official detail pages',
            'fetchMode':p.get('fetchMode'),
            'sourceDataUpdatedAt':p.get('sourceDataUpdatedAt'),
            'safeFloorParser':p.get('safeFloorParser'),
            'sinyiStructuredFloorMatching':p.get('sinyiStructuredFloorMatching'),
            'sinyiFloorEnrichment':sf,
            'companyNearTieGuard':near,
            'ambiguityAudit':{
                'auditedAt':aa.get('auditedAt'),
                'propertyGroupCount':aa.get('propertyGroupCount'),
                'companyListingCount':aa.get('companyListingCount'),
                'companyMatchCount':aa.get('companyMatchCount'),
                'companyNearTieStrongCount':aa.get('companyNearTieStrongCount'),
                'chosenCandidateRecomputeMismatchCount':aa.get('chosenCandidateRecomputeMismatchCount'),
                'weakIdentityAlreadyMergedPairCount':aa.get('weakIdentityAlreadyMergedPairCount'),
            },
            'snapshotCapturedAt':s.get('capturedAt'),
            'companySnapshotCapturedAt':p.get('companySnapshotCapturedAt'),
            'companyGapGeneratedAt':p.get('generatedAt'),
            'browserListingCount':s.get('listingCount'),
            'companyListingCount':p.get('companyListingCount'),
            'propertyGroupCount':p.get('propertyGroupCount'),
            'rawListingCount':p.get('rawListingCount'),
            'comparisonCount':len(comparisons),
            'coveredRoads':p.get('coveredRoads'),
            'roadCounts':{r:(st or {}).get('count') for r,st in (s.get('roadStatus') or {}).items()},
            'pagination':{r:{
                'expected':(st or {}).get('paginationExpected'),
                'lastPage':(st or {}).get('paginationLastPage'),
                'exhausted':(st or {}).get('paginationExhausted'),
                'completeAllPages':(st or {}).get('paginationCompleteAllPages'),
            } for r,st in (s.get('roadStatus') or {}).items()},
            'counts':p.get('counts'),
            'crossPlatformMergedGroupCount':p.get('crossPlatformMergedGroupCount'),
            'crossSourceReviewCount':p.get('crossSourceReviewCount'),
            'preview591Regroup':p.get('preview591Regroup'),
            'schemeAGroupIntegrity':p.get('schemeAGroupIntegrity'),
            'idIntegrityGuard':s.get('idIntegrityGuard'),
            'candidateCount':len(candidates),
            'candidatesWithFloor':sum(1 for x in candidates if x.get('floor')),
            'candidatesWithYcCaseId':sum(1 for x in candidates if x.get('officialCaseId')),
            'detailFloorEnrichment':s.get('detailFloorEnrichment'),
            'legacyFallbacks':False,
            'canonicalPublisher':'yungching-preview.yml',
            'valid':True,
          }
          assert manifest['sourceDataUpdatedAt'] and manifest['sourceDataUpdatedAt'] == d.get('updatedAt'), (manifest['sourceDataUpdatedAt'], d.get('updatedAt'))
          assert manifest['safeFloorParser'] is True, manifest
          assert manifest['sinyiStructuredFloorMatching'] is True, manifest
          assert sf.get('complete') is True, sf
          assert sf.get('activeSinyiCount') == sf.get('matchedOfficialCount') == sf.get('appliedCount'), sf
          assert int(near.get('remainingAutoNearTieCount') or 0) == 0, near
          assert int(aa.get('companyNearTieStrongCount') or 0) == 0, aa
          assert int(aa.get('chosenCandidateRecomputeMismatchCount') or 0) == 0, aa
          assert manifest['snapshotCapturedAt'] == manifest['companySnapshotCapturedAt'], manifest
          assert manifest['browserListingCount'] == manifest['companyListingCount'], manifest
          assert manifest['propertyGroupCount'] == manifest['comparisonCount'], manifest
          assert all(x.get('completeAllPages') is True and x.get('exhausted') is True for x in manifest['pagination'].values()), manifest['pagination']
          Path('docs/preview/scheme-a-verification.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY

      - name: Audit exact canonical files before atomic publish
        run: python scripts/write_scheme_a_saved_output_audit.py

      - name: Open generated Preview in Chromium before publish
        run: python scripts/smoke_test_preview_ui.py

      - name: Save verified canonical Preview output
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-output
          core_files=(
            company-gap.json
            yungching-preview-run.log
            yungching-browser-snapshot.json
            yungching-detail-floor.json
            sinyi-floor-enrichment.json
            scheme-a-ambiguity-audit.json
            scheme-a-verification.json
            scheme-a-saved-output-audit.json
            index.html
          )
          for f in "${core_files[@]}"; do
            [[ -f "docs/preview/$f" ]] || { echo "Missing canonical output: $f"; exit 1; }
            cp "docs/preview/$f" "/tmp/yungching-preview-output/$f"
          done

          # Never atomically publish a comparison made from an older monitor snapshot.
          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          v=json.loads(Path('/tmp/yungching-preview-output/scheme-a-verification.json').read_text(encoding='utf-8'))
          raw=subprocess.check_output(['git','show','origin/main:docs/data/listings.json'], text=True)
          latest=json.loads(raw)
          if latest.get('updatedAt') != v.get('sourceDataUpdatedAt'):
              Path('/tmp/canonical-source-changed').write_text('1')
              raise SystemExit(f"Monitor source changed during Preview build: {v.get('sourceDataUpdatedAt')} -> {latest.get('updatedAt')}; skip stale publish")
          PY

          git reset --hard origin/main
          for f in /tmp/yungching-preview-output/*; do
            cp "$f" "docs/preview/$(basename "$f")"
          done
          for f in "${core_files[@]}"; do
            git add "docs/preview/$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish canonical verified scheme A Preview"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Save failed scheme A diagnostics separately
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          if [[ -f /tmp/canonical-source-changed ]]; then
            echo "Source data changed during build; a fresh run will be triggered by the monitor commit. No failure snapshot saved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-failed
          [[ -f docs/preview/yungching-preview-run.log ]] && cp docs/preview/yungching-preview-run.log /tmp/yungching-preview-failed/yungching-preview-run-failed.log || true
          [[ -f docs/preview/company-gap.json ]] && cp docs/preview/company-gap.json /tmp/yungching-preview-failed/company-gap-failed.json || true
          [[ -f docs/preview/yungching-browser-snapshot.json ]] && cp docs/preview/yungching-browser-snapshot.json /tmp/yungching-preview-failed/yungching-browser-snapshot-failed.json || true
          [[ -f docs/preview/yungching-detail-floor.json ]] && cp docs/preview/yungching-detail-floor.json /tmp/yungching-preview-failed/yungching-detail-floor-failed.json || true
          [[ -f docs/preview/sinyi-floor-enrichment.json ]] && cp docs/preview/sinyi-floor-enrichment.json /tmp/yungching-preview-failed/sinyi-floor-enrichment-failed.json || true
          [[ -f docs/preview/scheme-a-ambiguity-audit.json ]] && cp docs/preview/scheme-a-ambiguity-audit.json /tmp/yungching-preview-failed/scheme-a-ambiguity-audit-failed.json || true
          [[ -f docs/preview/scheme-a-saved-output-audit.json ]] && cp docs/preview/scheme-a-saved-output-audit.json /tmp/yungching-preview-failed/scheme-a-saved-output-audit-failed.json || true

          git fetch origin main
          git reset --hard origin/main
          changed=()
          for f in /tmp/yungching-preview-failed/*; do
            [[ -e "$f" ]] || continue
            name="$(basename "$f")"
            cp "$f" "docs/preview/$name"
            changed+=("docs/preview/$name")
          done
          ((${#changed[@]})) || exit 0
          git add "${changed[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "Save failed scheme A diagnostics separately"
            git push origin HEAD:main || true
          fi
