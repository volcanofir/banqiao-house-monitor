# Standalone/manual canonical Preview publisher. Scheduled monitoring now builds the
# same canonical output in monitor-clean.yml to avoid a second checkout/setup/VPN.
name: 永慶公司案件比對 PREVIEW

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-preview.yml"
      - "scripts/compare_yungching_preview.py"
      - "scripts/compare_yungching_preview_v2.py"
      - "scripts/compare_yungching_preview_v3.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/compare_yungching_preview_v7.py"
      - "scripts/compare_yungching_preview_v8.py"
      - "scripts/sinyi_preview_floor_enrich.py"
      - "scripts/audit_scheme_a_ambiguity.py"
      - "scripts/audit_scheme_a_ambiguity_v2.py"
      - "scripts/yungching_dom_snapshot.py"
      - "scripts/yungching_dom_snapshot_v2.py"
      - "scripts/yungching_dom_snapshot_v3.py"
      - "scripts/yungching_dom_snapshot_v4.py"
      - "scripts/yungching_dom_snapshot_v5.py"
      - "scripts/yungching_detail_floor_enrich.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/run_with_system_chrome.py"
      - "scripts/connect_surfshark_wireguard.sh"
      - "scripts/patch_preview_ui.py"
      - "scripts/patch_offmarket_ui.py"
      - "scripts/add_recent_offmarket.py"
      - "scripts/smoke_test_preview_ui.py"
      - "scripts/validate_scheme_a_preview.py"
      - "scripts/validate_scheme_a_preview_v2.py"
      - "scripts/validate_scheme_a_preview_v3.py"
      - "scripts/write_scheme_a_verification.py"
      - "scripts/write_scheme_a_saved_output_audit.py"
      - "docs/data/listings.json"

permissions:
  contents: write
  pages: write

concurrency:
  group: banqiao-scheme-a-preview-canonical
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 cryptography playwright

      - name: Find usable Surfshark exit for Yongching
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Surfshark Yongching attempt $attempt/5"
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/run_with_system_chrome.py scripts/yungching_browser_preflight.py; then
              echo "Found Surfshark exit accepted by Yongching system Chrome."
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 4
          done
          exit 1

      - name: Extract official DOM through the actual last page and sanitize IDs
        run: python scripts/run_with_system_chrome.py scripts/yungching_dom_snapshot_v5.py

      - name: Enrich missing floors from verified cache or official detail
        run: python scripts/run_with_system_chrome.py scripts/yungching_detail_floor_enrich.py

      - name: Disconnect Surfshark before Preview comparison
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Build Preview-only Sinyi structured floor snapshot
        run: python scripts/sinyi_preview_floor_enrich.py

      - name: Regroup 591, merge with structured Sinyi floors, then compare Yongching
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v8.py 2>&1 | tee docs/preview/yungching-preview-run.log

      - name: Harden Preview UI and validate scheme A
        run: python scripts/patch_preview_ui.py

      - name: Validate scheme A v3 again before audit and manifest
        run: python scripts/validate_scheme_a_preview_v3.py

      - name: Re-run ambiguity audit with structured floors
        run: python scripts/audit_scheme_a_ambiguity_v2.py

      - name: Write canonical scheme A verification manifest
        run: python scripts/write_scheme_a_verification.py

      - name: Audit exact canonical files before atomic publish
        run: python scripts/write_scheme_a_saved_output_audit.py

      - name: Open generated Preview in system Chrome before publish
        run: python scripts/run_with_system_chrome.py scripts/smoke_test_preview_ui.py

      - name: Save verified canonical Preview output
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-output
          core_files=(
            company-gap.json
            yungching-preview-run.log
            yungching-browser-snapshot.json
            yungching-detail-floor.json
            sinyi-floor-enrichment.json
            scheme-a-ambiguity-audit.json
            scheme-a-verification.json
            scheme-a-saved-output-audit.json
            index.html
          )
          for f in "${core_files[@]}"; do
            [[ -f "docs/preview/$f" ]] || { echo "Missing canonical output: $f"; exit 1; }
            cp "docs/preview/$f" "/tmp/yungching-preview-output/$f"
          done

          git fetch origin main
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          v=json.loads(Path('/tmp/yungching-preview-output/scheme-a-verification.json').read_text(encoding='utf-8'))
          latest=json.loads(subprocess.check_output(['git','show','origin/main:docs/data/listings.json'], text=True))
          if latest.get('updatedAt') != v.get('sourceDataUpdatedAt'):
              Path('/tmp/canonical-source-changed').write_text('1')
              raise SystemExit(f"Monitor source changed during Preview build: {v.get('sourceDataUpdatedAt')} -> {latest.get('updatedAt')}; skip stale publish")
          PY

          git reset --hard origin/main
          for f in /tmp/yungching-preview-output/*; do
            cp "$f" "docs/preview/$(basename "$f")"
          done
          for f in "${core_files[@]}"; do git add "docs/preview/$f"; done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish canonical verified scheme A Preview"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Request GitHub Pages build for canonical commit
        id: pages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Save failed scheme A diagnostics separately
        if: failure() && steps.pages.outcome != 'failure'
        continue-on-error: true
        shell: bash
        run: |
          set -e
          if [[ -f /tmp/canonical-source-changed ]]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/yungching-preview-failed
          for src in yungching-preview-run.log company-gap.json yungching-browser-snapshot.json yungching-detail-floor.json sinyi-floor-enrichment.json scheme-a-ambiguity-audit.json scheme-a-saved-output-audit.json; do
            [[ -f "docs/preview/$src" ]] && cp "docs/preview/$src" "/tmp/yungching-preview-failed/${src%.json}-failed${src##*.}" || true
          done
          git fetch origin main
          git reset --hard origin/main
          changed=()
          for f in /tmp/yungching-preview-failed/*; do
            [[ -e "$f" ]] || continue
            name="$(basename "$f")"
            cp "$f" "docs/preview/$name"
            changed+=("docs/preview/$name")
          done
          ((${#changed[@]})) || exit 0
          git add "${changed[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "Save failed scheme A diagnostics separately"
            git push origin HEAD:main || true
          fi
