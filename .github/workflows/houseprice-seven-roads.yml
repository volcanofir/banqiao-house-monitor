name: 5168 seven-road snapshot
on:
  workflow_dispatch:
  schedule:
    # Independent 5168 cloud verification even when 591/Sinyi full checks fail.
    - cron: "17 1,4,7,10,13,16,19,22 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_houseprice_seven_roads_preview.py"
      - "scripts/validate_houseprice_preview_snapshot.py"
      - ".github/workflows/houseprice-seven-roads.yml"
permissions:
  contents: write
  actions: write
concurrency:
  group: houseprice-seven-roads
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch and validate 5168 seven roads
        run: |
          python scripts/fetch_houseprice_seven_roads_preview.py
          python scripts/validate_houseprice_preview_snapshot.py
      - name: Publish only validated 5168 snapshot without overwriting newer data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/houseprice-seven-roads.json /tmp/houseprice-verified.json
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path("/tmp/houseprice-verified.json").read_text(encoding="utf-8"))
          existing_path=Path("docs/preview/houseprice-seven-roads.json")
          existing=json.loads(existing_path.read_text(encoding="utf-8")) if existing_path.exists() else {}
          if src.get("complete") is not True or src.get("updatedAt") is None:
              raise SystemExit("Refusing to publish unverified 5168 snapshot")
          if existing.get("updatedAt") and existing["updatedAt"] > src["updatedAt"]:
              print("A newer 5168 snapshot is already available; preserving it")
          else:
              existing_path.write_text(json.dumps(src,ensure_ascii=False,indent=2),encoding="utf-8")
              print("Verified 5168 source check published at",src["updatedAt"])
          PY
          git add docs/preview/houseprice-seven-roads.json
          if git diff --cached --quiet; then
            echo "Latest verified 5168 snapshot already present."
            exit 0
          fi
          git commit -m "Refresh independently verified 5168 seven-road snapshot"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "5168 feed refreshed; no changes to production listings."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Update existing Preview when recent official company snapshot is available
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:docs/preview/yungching-browser-snapshot.json > /tmp/5168-current-company.json
          if python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path("/tmp/5168-current-company.json").read_text(encoding="utf-8"))
          d=datetime.fromisoformat(str(p.get("capturedAt") or "").replace("Z","+00:00"))
          age=(datetime.now(timezone.utc)-d).total_seconds()/60
          assert 0<=age<=65, f"Official company snapshot too old ({age:.0f} min)"
          print("Existing verified official company snapshot is fresh enough for Preview rebuild")
          PY
          then
            if gh workflow run rebuild-original-preview-from-verified-snapshot.yml --ref main; then
              echo "Dispatched original Preview-only rebuild with verified 5168 data"
            else
              echo "::warning::Cached Preview rebuild dispatch unavailable; original Preview will continue on its full-check cadence"
            fi
          else
            echo "Company snapshot exceeds safe reuse age; 5168 feed refreshed independently without publishing stale comparison"
          fi
