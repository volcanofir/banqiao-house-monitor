name: 591 legacy payload shape probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_591_mobile_payload_shape.py"
      - ".github/workflows/probe-591-mobile-shape.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 playwright
      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh
      - name: Inspect legacy API payload
        run: python scripts/probe_591_mobile_payload_shape.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 591-mobile-shape
          path: artifacts/591-mobile-shape.json
          if-no-files-found: warn
          retention-days: 7
      - name: Disconnect Surfshark
        if: always()
        run: sudo wg-quick down surfshark || true
