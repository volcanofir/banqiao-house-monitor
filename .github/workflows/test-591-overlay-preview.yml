name: Test 591 integration into original Preview

on:
  push:
    branches:
      - "main"
    paths:
      - "scripts/apply_591_warelist_to_original_preview.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/warelist_structured_fields.py"
      - "tests/test_591_warelist_structured_fields.py"
      - "tests/test_apply_591_original_preview.py"
      - ".github/workflows/test-591-overlay-preview.yml"
      - "scripts/compare_yungching_preview_v3.py"
      - "scripts/patch_rakuya_integrated_ui.py"
      - "tests/test_preview_earliest_listing_time.py"
      - "scripts/audit_scheme_a_ambiguity_v2.py"
      - "tests/test_preview_identity_retention.py"
      - "scripts/smoke_test_preview_ui.py"
      - "scripts/patch_preview_ui.py"
  pull_request:
    paths:
      - "scripts/apply_591_warelist_to_original_preview.py"
      - "tests/test_apply_591_original_preview.py"
      - "scripts/patch_preview_ui.py"
      - "scripts/compare_yungching_preview_v11.py"
      - ".github/workflows/test-591-overlay-preview.yml"

permissions:
  contents: read

jobs:
  verify-original-preview-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: pip install requests beautifulsoup4 playwright
      - name: Check syntax of original Preview integration
        run: |
          python -m py_compile scripts/apply_591_warelist_to_original_preview.py scripts/patch_preview_ui.py scripts/compare_yungching_preview_v11.py scripts/compare_yungching_preview_v3.py scripts/patch_rakuya_integrated_ui.py
      - name: Test real 591 snapshot and historical identity without writes
        run: |
          python -m unittest discover -s tests -p "test_591_warelist_structured_fields.py" -v
          python -m unittest discover -s tests -p "test_apply_591_original_preview.py" -v
          python -m unittest discover -s tests -p "test_preview_earliest_listing_time.py" -v
          python -m unittest discover -s tests -p "test_preview_identity_retention.py" -v
      - name: Build existing Preview-only source overlay
        run: |
          python scripts/sinyi_preview_floor_enrich.py
          python scripts/apply_591_warelist_to_original_preview.py
      - name: Rebuild original multi-source grouping using stored verified snapshots
        run: |
          python scripts/append_rakuya_to_scheme_a.py
          python scripts/append_houseprice_to_scheme_a.py
          python scripts/compare_yungching_preview_v11.py > /tmp/591-integrated-compare.log
          python scripts/patch_preview_ui.py
          python scripts/validate_scheme_a_preview_v3.py
          python scripts/audit_scheme_a_ambiguity_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("docs/preview/scheme-a-ambiguity-audit.json").read_text(encoding="utf-8"))
          assert report["chosenCandidateRecomputeMismatchCount"] == 0
          assert report["companyNearTieStrongCount"] == 0
          print("Conservative Preview merge audit:", report["weakIdentityAlreadyMergedPairCount"],
                "risky raw pairs requiring further review")
          PY
          python scripts/write_scheme_a_verification.py > /tmp/591-integrated-verify.log
          python scripts/write_scheme_a_saved_output_audit.py > /tmp/591-integrated-audit.log
          python scripts/run_with_system_chrome.py scripts/smoke_test_preview_ui.py
          echo "Original scheme A grouping, 591 duplicate merge, cross-platform comparison and mobile UI smoke passed."

      - name: Ensure original dashboard input changes only locally
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("docs/data/listings.json").read_text(encoding="utf-8"))
          overlay=json.loads(Path("docs/preview/preview-monitor-state.json").read_text(encoding="utf-8"))
          assert original["updatedAt"] == overlay["updatedAt"]
          assert original["listings"] != overlay["listings"]
          assert overlay["previewSources"]["591"]["mode"] == "warelist_preview"
          assert overlay["previewSources"]["591"]["missingIdIsNotDelisting"] is True
          print("Original /preview/ data overlay verified; canonical remains unchanged.")
          PY
          if [[ -n "$(git status --porcelain -- docs/data docs/index.html state)" ]]; then
            echo "::error::Production files were modified by Preview overlay."
            exit 1
          fi
          grep -q 'preview-monitor-state.json' scripts/patch_preview_ui.py
          grep -q '首次上架：' docs/preview/index.html
          if grep -q '首次上架（最早已知）：' docs/preview/index.html; then
            echo "::error::Deprecated first-listing label returned."
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          gap=json.loads(Path("docs/preview/company-gap.json").read_text(encoding="utf-8"))
          assert gap["newListingTimePolicy"] == "earliest_known_source_time_from_merged_ids_and_permanent_id_history_no_monitor_discovery"
          assert all(x.get("propertyFirstPublishedBasis") in ("earliest_known_source_timestamp","unavailable_no_source_publish_date") for x in gap.get("propertyGroups", []))
          print("Earliest source dates and card labels verified.")
          PY
