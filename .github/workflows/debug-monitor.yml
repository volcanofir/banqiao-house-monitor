name: 監控排程除錯

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-monitor.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4 playwright

      - name: Run full diagnostic and preserve results
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/monitor-debug docs/data
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          MONITOR_SOURCE=sinyi python scripts/monitor_fast.py > /tmp/monitor-debug/sinyi.log 2>&1
          SINYI_RC=$?

          python scripts/enrich_sinyi_first_display.py > /tmp/monitor-debug/enrich.log 2>&1
          ENRICH_RC=$?

          bash scripts/connect_surfshark_wireguard.sh > /tmp/monitor-debug/vpn.log 2>&1
          VPN_RC=$?

          if [ "$VPN_RC" -eq 0 ]; then
            MONITOR_SOURCE=591 python scripts/monitor_fast.py > /tmp/monitor-debug/591.log 2>&1
            M591_RC=$?
          else
            echo "591 skipped because VPN setup failed." > /tmp/monitor-debug/591.log
            M591_RC=99
          fi

          python scripts/dedupe_listings_v2.py > /tmp/monitor-debug/dedupe.log 2>&1
          DEDUPE_RC=$?
          python scripts/normalize_source_times.py > /tmp/monitor-debug/normalize.log 2>&1
          NORMALIZE_RC=$?
          python scripts/track_price_changes.py > /tmp/monitor-debug/price.log 2>&1
          PRICE_RC=$?
          python scripts/remove_first_seen_ui.py > /tmp/monitor-debug/ui.log 2>&1
          UI_RC=$?

          export STARTED_AT SINYI_RC ENRICH_RC VPN_RC M591_RC DEDUPE_RC NORMALIZE_RC PRICE_RC UI_RC
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = ['sinyi','enrich','vpn','591','dedupe','normalize','price','ui']
          codes = {
              'sinyi': int(os.environ['SINYI_RC']),
              'enrich': int(os.environ['ENRICH_RC']),
              'vpn': int(os.environ['VPN_RC']),
              '591': int(os.environ['M591_RC']),
              'dedupe': int(os.environ['DEDUPE_RC']),
              'normalize': int(os.environ['NORMALIZE_RC']),
              'price': int(os.environ['PRICE_RC']),
              'ui': int(os.environ['UI_RC']),
          }
          logs = {}
          for name in names:
              p = Path('/tmp/monitor-debug') / f'{name}.log'
              text = p.read_text(encoding='utf-8', errors='replace') if p.exists() else ''
              logs[name] = text[-6000:]
          payload = {
              'startedAt': os.environ['STARTED_AT'],
              'finishedAt': __import__('datetime').datetime.now(__import__('datetime').timezone.utc).isoformat(),
              'exitCodes': codes,
              'allCriticalOk': codes['sinyi'] == 0 and codes['vpn'] == 0 and codes['591'] == 0,
              'logs': logs,
          }
          Path('docs/data/last-monitor-debug.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Save diagnostic and any refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/data/last-monitor-debug.json docs/data/sinyi-first-display-cache.json docs/index.html 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Run monitor diagnostic"
          git pull --rebase
          git push
