name: 方案 A 邏輯完整性 Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheme-a-logic-regression.yml"
      - "scripts/test_scheme_a_integrity.py"
      - "scripts/compare_yungching_preview_v4.py"
      - "scripts/compare_yungching_preview_v5.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/compare_yungching_preview_v7.py"
      - "scripts/compare_yungching_preview_v8.py"
      - "scripts/patch_preview_ui.py"
      - "scripts/smoke_test_preview_ui.py"
      - "scripts/validate_scheme_a_preview.py"
      - "scripts/validate_scheme_a_preview_v2.py"
      - "scripts/validate_scheme_a_preview_v3.py"

permissions:
  contents: write

concurrency:
  group: banqiao-scheme-a-logic-regression
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install regression dependencies
        run: |
          pip install requests beautifulsoup4 playwright cryptography
          python -m playwright install chromium

      - name: Run deterministic v8 integrity tests
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          p=subprocess.run(['python','scripts/test_scheme_a_integrity.py'],text=True,capture_output=True)
          out={
            'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'returncode':p.returncode,
            'stdout':p.stdout[-12000:],
            'stderr':p.stderr[-12000:],
            'logicPassed':False,
            'uiSmokePassed':False,
            'passed':False,
          }
          if p.returncode==0:
            lines=[x for x in p.stdout.strip().splitlines() if x.strip()]
            try:
              result=json.loads(lines[-1]) if lines else {}
              out.update(result)
              out['logicPassed']=result.get('passed') is True
              out['passed']=False
            except Exception as exc:
              out['parseError']=f'{type(exc).__name__}: {exc}'
          Path('docs/preview/scheme-a-logic-regression.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Validate saved canonical output and run Chromium Preview smoke test
        id: ui
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/patch_preview_ui.py
          python scripts/validate_scheme_a_preview_v3.py
          python scripts/smoke_test_preview_ui.py

      - name: Record full stability result
        if: always()
        shell: bash
        env:
          UI_OUTCOME: ${{ steps.ui.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('docs/preview/scheme-a-logic-regression.json')
          out=json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          out['uiSmokePassed']=os.environ.get('UI_OUTCOME')=='success'
          out['passed']=bool(out.get('logicPassed') is True and out.get('uiSmokePassed') is True)
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Save regression diagnostic
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/scheme-a-logic-regression.json /tmp/result.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/result.json docs/preview/scheme-a-logic-regression.json
          git add docs/preview/scheme-a-logic-regression.json
          if ! git diff --cached --quiet; then
            git commit -m "Save scheme A stable regression"
            git push origin HEAD:main
          fi

      - name: Fail if stable regression did not pass
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/preview/scheme-a-logic-regression.json').read_text(encoding='utf-8'))
          assert x.get('logicPassed') is True, x
          assert x.get('uiSmokePassed') is True, x
          assert x.get('passed') is True, x
          print('Stable v8 regression passed: logic + validator + Chromium UI smoke')
          PY
