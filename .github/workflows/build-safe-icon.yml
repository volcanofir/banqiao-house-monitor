name: 建立手機圖示

on:
  push:
    branches: [main]
    paths:
      - "docs/icon-safe.svg"
      - ".github/workflows/build-safe-icon.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build PNG and ICO icons
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          rsvg-convert -w 180 -h 180 docs/icon-safe.svg -o docs/icon-safe-180.png
          rsvg-convert -w 32 -h 32 docs/icon-safe.svg -o docs/icon-safe-32.png
          convert docs/icon-safe-32.png docs/favicon.ico

      - name: Point Safari and browsers to safe icons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          block = '''  <link rel="apple-touch-icon" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211242" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211242" />
  <link rel="icon" type="image/png" sizes="32x32" href="/banqiao-house-monitor/icon-safe-32.png?v=202608211242" />
  <link rel="icon" type="image/svg+xml" href="/banqiao-house-monitor/icon-safe.svg?v=202608211242" />
  <link rel="shortcut icon" href="/banqiao-house-monitor/favicon.ico?v=202608211242" />
  <meta property="og:image" content="https://volcanofir.github.io/banqiao-house-monitor/icon-safe-180.png?v=202608211242" />'''
          s = re.sub(r'\s*<link rel="apple-touch-icon"[^>]*>\s*<link rel="icon"[^>]*>\s*<link rel="shortcut icon"[^>]*>', '\n'+block, s, count=1)
          if 'apple-touch-icon-precomposed' not in s:
              raise SystemExit('icon head replacement failed')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Save generated icons and website references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/icon-safe-180.png docs/icon-safe-32.png docs/favicon.ico docs/index.html
          git diff --cached --quiet || git commit -m "Use safe Safari and home screen icons"
          git pull --rebase
          git push
