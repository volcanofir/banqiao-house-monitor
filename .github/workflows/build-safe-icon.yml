name: 建立手機圖示

on:
  push:
    branches: [main]
    paths:
      - "docs/icon-safe.svg"
      - ".github/workflows/build-safe-icon.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build PNG and ICO icons
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          rsvg-convert -w 180 -h 180 docs/icon-safe.svg -o docs/icon-safe-180.png
          rsvg-convert -w 32 -h 32 docs/icon-safe.svg -o docs/icon-safe-32.png
          convert docs/icon-safe-32.png docs/favicon.ico
      - name: Save generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/icon-safe-180.png docs/icon-safe-32.png docs/favicon.ico
          git diff --cached --quiet || git commit -m "Build safe mobile icons"
          git pull --rebase
          git push
