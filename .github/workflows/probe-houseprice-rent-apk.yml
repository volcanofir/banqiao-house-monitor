name: 5168 rental APK decompile probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_houseprice_rent_apk.py"
      - ".github/workflows/probe-houseprice-rent-apk.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install androguard requests
      - name: Install apktool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apktool
      - run: python scripts/probe_houseprice_rent_apk.py
