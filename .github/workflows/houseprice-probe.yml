name: 5168 source probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/houseprice-probe.yml"
      - "scripts/houseprice_probe.py"
permissions:
  contents: write
concurrency:
  group: houseprice-source-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 playwright cryptography
      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh; then
              echo "Surfshark connected"
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Probe 5168 through Surfshark and Chrome
        run: python scripts/run_with_system_chrome.py scripts/houseprice_probe.py
      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save probe
        if: always()
        shell: bash
        run: |
          [[ -f docs/preview/houseprice-probe.json ]] || exit 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/houseprice-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save 5168 Surfshark source probe"
          git pull --rebase
          git push
