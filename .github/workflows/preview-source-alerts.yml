name: Preview four-source freshness alerts

on:
  workflow_dispatch:
  schedule:
    # Read-only alert check every hour. Never crawls or changes listings.
    - cron: "41 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-source-alerts.yml"
      - "scripts/check_preview_source_freshness.py"
      - "tests/test_preview_source_freshness.py"

permissions:
  contents: read

concurrency:
  group: banqiao-preview-source-alerts
  cancel-in-progress: true

jobs:
  source-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test safe source freshness rules
        run: python -m unittest discover -s tests -p "test_preview_source_freshness.py" -v
      - name: Alert only when a source is stale, invalid or missing
        run: python scripts/check_preview_source_freshness.py
