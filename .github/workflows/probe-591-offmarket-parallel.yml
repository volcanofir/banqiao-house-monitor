name: 591 parallel off-market probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_591_offmarket_parallel.py"
      - ".github/workflows/probe-591-offmarket-parallel.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: pip install playwright

      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh

      - name: Run sequential baseline
        run: |
          mkdir -p artifacts
          python scripts/run_with_system_chrome.py scripts/preview_591_offmarket_probe.py
          cp docs/preview/591-offmarket-probe.json artifacts/591-offmarket-sequential.json

      - name: Run parallel probe
        run: python scripts/probe_591_offmarket_parallel.py

      - name: Upload comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 591-offmarket-parallel-report
          path: |
            artifacts/591-offmarket-sequential.json
            artifacts/591-offmarket-parallel.json
          if-no-files-found: warn
          retention-days: 7

      - name: Disconnect Surfshark
        if: always()
        run: sudo wg-quick down surfshark || true
