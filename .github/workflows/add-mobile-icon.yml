name: 手機桌面圖示設定

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-mobile-icon.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Add iPhone home screen icon metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '  <meta name="theme-color" content="#f5d331" />'
          block = '''  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="板橋新案監控" />
  <meta name="application-name" content="板橋新案監控" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260821" />
  <link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon.png?v=20260821" />'''

          if 'rel="apple-touch-icon"' not in s:
              if marker not in s:
                  raise SystemExit('theme-color marker not found')
              s = s.replace(marker, block + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Icon metadata already present; no change needed.')
          PY

      - name: Save website icon settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "Use custom mobile home screen icon"
          git pull --rebase
          git push
