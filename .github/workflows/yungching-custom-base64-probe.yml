name: 永慶 SSR Custom Base64 Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-custom-base64-probe.yml"
      - "scripts/yungching_custom_base64_probe.py"
      - "scripts/yungching_crypto.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/connect_surfshark_wireguard.sh"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-custom-base64-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright and crypto
        run: |
          pip install playwright cryptography requests beautifulsoup4
          python -m playwright install chromium
      - name: Connect Surfshark and verify Yongching Chromium
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then exit 0; fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1
      - name: Recover custom Base64 substitutions
        run: python scripts/yungching_custom_base64_probe.py
      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save sanitized decode probe
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/yungching-custom-base64-probe.json /tmp/probe.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/probe.json docs/preview/yungching-custom-base64-probe.json
          git add docs/preview/yungching-custom-base64-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Yongching custom Base64 probe"
          git push origin HEAD:main
