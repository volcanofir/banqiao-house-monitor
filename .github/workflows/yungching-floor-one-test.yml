name: 永慶樓層單筆 DOM 測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-floor-one-test.yml"
      - "scripts/yungching_detail_floor_enrich.py"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-floor-one-test
  cancel-in-progress: true

jobs:
  floor-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install chromium
      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then exit 0; fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1
      - name: Test rendered detail floor
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import scripts.yungching_detail_floor_enrich as f

          url='https://buy.yungching.com.tw/house/6935425'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              c=b.new_context(locale='zh-TW', timezone_id='Asia/Taipei')
              page=c.new_page()
              r=page.goto(url, wait_until='domcontentloaded', timeout=35000)
              f.render_full_detail(page)
              focused, body, snippets=f.rendered_floor_context(page)
              basic=f.slice_basic_info(body)
              floor,evidence,mode=f.floor_from_detail_text(basic, allow_unlabelled=True)
              if not floor:
                  floor,evidence,mode=f.floor_from_detail_text(focused, allow_unlabelled=False)
              if not floor:
                  floor,evidence,mode=f.floor_from_detail_text(body, allow_unlabelled=False)
              out={
                  'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
                  'url':url,
                  'http':r.status if r else None,
                  'finalUrl':page.url,
                  'floor':floor,
                  'mode':mode,
                  'evidence':evidence,
                  'basicInfo':basic[:1000],
                  'snippets':snippets[:12],
              }
              b.close()
          assert out['http']==200, out
          assert out['floor'], out
          Path('docs/preview/yungching-floor-one-test.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save focused floor result
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/yungching-floor-one-test.json /tmp/floor-one.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/floor-one.json docs/preview/yungching-floor-one-test.json
          git add docs/preview/yungching-floor-one-test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save verified Yongching floor DOM test"
          git push origin HEAD:main
