name: 永慶 SSR ng-state 診斷

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-ng-state-diagnostic.yml"
      - "scripts/yungching_ng_state_probe.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/connect_surfshark_wireguard.sh"

# Diagnostic-only workflow; never publishes canonical Preview files.
permissions:
  contents: write

concurrency:
  group: banqiao-yungching-ng-state-diagnostic
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install chromium
      - name: Connect Surfshark and verify Yongching Chromium
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1
      - name: Inspect Angular SSR TransferState
        run: python scripts/yungching_ng_state_probe.py
      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save sanitized ng-state structure
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/yungching-ng-state-probe.json /tmp/ng-state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/ng-state.json docs/preview/yungching-ng-state-probe.json
          git add docs/preview/yungching-ng-state-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Yongching ng-state diagnostic"
          git push origin HEAD:main
