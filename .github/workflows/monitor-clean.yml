name: 板橋房屋監控 CLEAN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-clean.yml"
      - "trigger/monitor-wakeup.txt"
  schedule:
    # Heartbeat every 10 minutes; actual fetch only runs when data is ~3 hours old.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: banqiao-house-monitor-clean
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Decide whether this run should fetch
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          # Manual dispatch / relevant push should always run immediately.
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          # Scheduled heartbeats are cheap: only do the full crawl once the
          # last successful data update is about 3 hours old.
          threshold_minutes = 170
          try:
              d = json.loads(Path('docs/data/listings.json').read_text(encoding='utf-8'))
              t = datetime.fromisoformat(str(d['updatedAt']).replace('Z', '+00:00'))
              if t.tzinfo is None:
                  t = t.replace(tzinfo=timezone.utc)
              age = (datetime.now(timezone.utc) - t.astimezone(timezone.utc)).total_seconds() / 60
              run = age >= threshold_minutes
              print(f'heartbeat freshness age={age:.1f} min; threshold={threshold_minutes} => {"run" if run else "skip"}')
          except Exception as exc:
              print(f'freshness check failed: {exc}; running monitor')
              run = True

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install monitor packages
        if: steps.gate.outputs.run == 'true'
        run: pip install requests beautifulsoup4 playwright

      - name: Fetch Sinyi
        if: steps.gate.outputs.run == 'true'
        env:
          MONITOR_SOURCE: sinyi
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor_fast.py

      - name: Enrich Sinyi publish time
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/enrich_sinyi_first_display.py

      - name: Connect Surfshark
        id: vpn
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2; do
            echo "Surfshark attempt $attempt/2"
            if bash scripts/connect_surfshark_wireguard.sh; then
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 5
          done
          exit 1

      - name: Fetch 591
        if: steps.gate.outputs.run == 'true' && steps.vpn.outcome == 'success'
        env:
          MONITOR_SOURCE: "591"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor_fast.py

      - name: Mark 591 stale if VPN failed
        if: steps.gate.outputs.run == 'true' && steps.vpn.outcome != 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('docs/data/listings.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          r = (d.setdefault('runs', {}).get('591') or {}).copy()
          r['checkedAt'] = datetime.now(timezone.utc).isoformat()
          r['status'] = 'error'
          r['message'] = 'Surfshark VPN 連線失敗，本輪未更新 591；沿用上一輪資料。'
          r['newCount'] = 0
          r['removedCount'] = 0
          d['runs']['591'] = r
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Normalize and track
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/dedupe_listings_v2.py
          python scripts/normalize_source_times.py
          python scripts/track_price_changes.py
          python scripts/remove_first_seen_ui.py

      - name: Save latest data
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/data/sinyi-first-display-cache.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Update monitored listings"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Heartbeat skipped
        if: steps.gate.outputs.run != 'true'
        run: echo "Data is still fresh; heartbeat finished without a full fetch."
