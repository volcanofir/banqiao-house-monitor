name: 板橋房屋監控 CLEAN

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/monitor-clean.yml"
  schedule:
    # Taiwan time: 00:07 / 03:07 / 06:07 / 09:07 / 12:07 / 15:07 / 18:07 / 21:07
    - cron: "7 1,4,7,10,13,16,19,22 * * *"
    # Backup +30 minutes
    - cron: "37 1,4,7,10,13,16,19,22 * * *"

permissions:
  contents: write

concurrency:
  group: banqiao-house-monitor-clean
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Skip fresh backup run
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$EVENT_SCHEDULE" != "37 1,4,7,10,13,16,19,22 * * *" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              d=json.loads(Path('docs/data/listings.json').read_text(encoding='utf-8'))
              t=datetime.fromisoformat(str(d['updatedAt']).replace('Z','+00:00'))
              if t.tzinfo is None: t=t.replace(tzinfo=timezone.utc)
              age=(datetime.now(timezone.utc)-t.astimezone(timezone.utc)).total_seconds()/60
              run=age>120
          except Exception:
              run=True
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write(f"run={'true' if run else 'false'}\n")
          PY

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install packages
        if: steps.gate.outputs.run == 'true'
        run: pip install requests beautifulsoup4 playwright

      - name: Fetch Sinyi
        if: steps.gate.outputs.run == 'true'
        env:
          MONITOR_SOURCE: sinyi
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor_fast.py

      - name: Enrich Sinyi publish time
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/enrich_sinyi_first_display.py

      - name: Connect Surfshark
        id: vpn
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh

      - name: Fetch 591
        if: steps.gate.outputs.run == 'true' && steps.vpn.outcome == 'success'
        env:
          MONITOR_SOURCE: "591"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/monitor_fast.py

      - name: Mark 591 stale if VPN failed
        if: steps.gate.outputs.run == 'true' && steps.vpn.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('docs/data/listings.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          r=(d.setdefault('runs',{}).get('591') or {}).copy()
          r['checkedAt']=datetime.now(timezone.utc).isoformat()
          r['status']='error'
          r['message']='Surfshark VPN 連線失敗，本輪未更新 591；沿用上一輪資料。'
          r['newCount']=0; r['removedCount']=0
          d['runs']['591']=r
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY

      - name: Normalize and track
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/dedupe_listings_v2.py
          python scripts/normalize_source_times.py
          python scripts/track_price_changes.py
          python scripts/remove_first_seen_ui.py

      - name: Ensure iPhone web app install assets
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 180 -h 180 docs/icon-safe.svg -o docs/icon-safe-180.png
          rsvg-convert -w 192 -h 192 docs/icon-safe.svg -o docs/icon-safe-192.png
          rsvg-convert -w 512 -h 512 docs/icon-safe.svg -o docs/icon-safe-512.png
          rsvg-convert -w 32 -h 32 docs/icon-safe.svg -o docs/icon-safe-32.png

          cat > docs/manifest.webmanifest <<'EOF'
          {
            "name": "板橋新案監控",
            "short_name": "板橋新案監控",
            "description": "板橋指定路段房屋新案監控",
            "start_url": "/banqiao-house-monitor/",
            "scope": "/banqiao-house-monitor/",
            "display": "standalone",
            "background_color": "#fff8df",
            "theme_color": "#f5d331",
            "icons": [
              {"src": "/banqiao-house-monitor/icon-safe-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable"},
              {"src": "/banqiao-house-monitor/icon-safe-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable"}
            ]
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('docs/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'^\s*<link rel="(?:apple-touch-icon|apple-touch-icon-precomposed|icon|shortcut icon|manifest)"[^>]*>\s*\n?', '', s, flags=re.MULTILINE)
          s=re.sub(r'^\s*<meta property="og:image"[^>]*>\s*\n?', '', s, flags=re.MULTILINE)
          s=re.sub(r'^\s*<meta name="mobile-web-app-capable"[^>]*>\s*\n?', '', s, flags=re.MULTILINE)
          marker='  <meta name="application-name" content="板橋新案監控" />\n'
          block='''  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/banqiao-house-monitor/manifest.webmanifest?v=202608211255" />
  <link rel="apple-touch-icon" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211255" />
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/banqiao-house-monitor/icon-safe-180.png?v=202608211255" />
  <link rel="icon" type="image/png" sizes="32x32" href="/banqiao-house-monitor/icon-safe-32.png?v=202608211255" />
  <link rel="shortcut icon" href="/banqiao-house-monitor/favicon.ico?v=202608211255" />
  <meta property="og:image" content="https://volcanofir.github.io/banqiao-house-monitor/icon-safe-512.png?v=202608211255" />
'''
          if marker not in s:
              raise SystemExit('application-name marker not found')
          s=s.replace(marker, marker+block, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Save latest data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/data/sinyi-first-display-cache.json docs/index.html docs/manifest.webmanifest docs/icon-safe-180.png docs/icon-safe-192.png docs/icon-safe-512.png docs/icon-safe-32.png docs/favicon.ico
          git diff --cached --quiet || git commit -m "Update monitored listings and iPhone install assets"
          git pull --rebase
          git push

      - name: Backup skipped
        if: steps.gate.outputs.run != 'true'
        run: echo "Data is fresh; backup fetch skipped."
