name: 信義 PREVIEW 樓層 Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sinyi-preview-floor-probe.yml"
      - "scripts/sinyi_preview_floor_probe.py"
      - "docs/data/listings.json"

permissions:
  contents: write

concurrency:
  group: banqiao-sinyi-preview-floor-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Probe official Sinyi list payload floor fields
        run: python scripts/sinyi_preview_floor_probe.py
      - name: Save Preview diagnostic
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/sinyi-floor-probe.json /tmp/sinyi-floor-probe.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/sinyi-floor-probe.json docs/preview/sinyi-floor-probe.json
          git add docs/preview/sinyi-floor-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Sinyi Preview floor probe"
          git push origin HEAD:main
