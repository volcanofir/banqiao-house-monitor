name: 方案 A 永慶 ID 完整性快速驗算

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheme-a-id-integrity-test.yml"
      - "scripts/yungching_dom_snapshot_v4.py"

permissions:
  contents: write

concurrency:
  group: banqiao-scheme-a-id-integrity-test
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install sanitizer import dependencies
        run: pip install playwright requests beautifulsoup4
      - name: Sanitize a working copy of current verified snapshot
        shell: bash
        run: |
          cp docs/preview/yungching-browser-snapshot.json /tmp/original.json
          python scripts/yungching_dom_snapshot_v4.py --sanitize-existing
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          guard=s.get('idIntegrityGuard') or {}
          assert guard.get('enabled') is True, guard
          assert guard.get('remainingCollisionIds') == [], guard
          assert guard.get('beforeCount') == 88, guard
          assert guard.get('afterCount') == 81, guard
          assert guard.get('removedCount') == 7, guard
          assert guard.get('collisionIds') == ['4308114'], guard
          expected={
            '板橋區中山路二段':38,
            '板橋區三民路一段':5,
            '板橋區三民路二段':29,
            '板橋區翠華街':6,
            '板橋區林森街':1,
            '板橋區萬安街':1,
            '板橋區光復街':1,
          }
          road_counts={r:(x or {}).get('count') for r,x in (s.get('roadStatus') or {}).items()}
          assert road_counts == expected, (road_counts, expected)
          out={
            'listingCount':s.get('listingCount'),
            'roadCounts':road_counts,
            'idIntegrityGuard':guard,
            'passed':True,
          }
          Path('docs/preview/scheme-a-id-integrity-test.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
          cp /tmp/original.json docs/preview/yungching-browser-snapshot.json
      - name: Save diagnostic only
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/scheme-a-id-integrity-test.json /tmp/result.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/result.json docs/preview/scheme-a-id-integrity-test.json
          git add docs/preview/scheme-a-id-integrity-test.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save scheme A ID integrity calculation"
          git push origin HEAD:main
