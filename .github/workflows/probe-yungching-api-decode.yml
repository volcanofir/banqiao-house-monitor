name: Yongching API decode probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_yungching_api_decode.py"
      - ".github/workflows/probe-yungching-api-decode.yml"
concurrency:
  group: yongching-api-decode-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - name: Find usable Surfshark exit
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Yongching probe exit $attempt/5"
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/run_with_system_chrome.py scripts/yungching_browser_preflight.py; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Probe decode path
        timeout-minutes: 3
        run: python scripts/run_with_system_chrome.py scripts/probe_yungching_api_decode.py
      - if: always()
        run: sudo wg-quick down surfshark || true
