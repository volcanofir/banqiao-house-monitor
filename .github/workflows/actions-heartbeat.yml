name: Actions 心跳檢查

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/actions-heartbeat.yml"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Write heartbeat
        run: |
          mkdir -p docs/data
          date -u +%Y-%m-%dT%H:%M:%SZ > docs/data/actions-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/actions-heartbeat.txt
          git commit -m "Record Actions heartbeat"
          git push
