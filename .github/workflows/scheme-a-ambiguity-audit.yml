name: 方案 A 歧義風險 Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheme-a-ambiguity-audit.yml"
      - "scripts/audit_scheme_a_ambiguity.py"
      - "docs/preview/company-gap.json"

permissions:
  contents: write

concurrency:
  group: banqiao-scheme-a-ambiguity-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit company near-ties and weak-identity merges
        run: python scripts/audit_scheme_a_ambiguity.py
      - name: Save ambiguity audit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/scheme-a-ambiguity-audit.json /tmp/audit.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/audit.json docs/preview/scheme-a-ambiguity-audit.json
          git add docs/preview/scheme-a-ambiguity-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save scheme A ambiguity audit"
          git push origin HEAD:main
