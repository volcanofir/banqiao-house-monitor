name: 租屋監控 Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rental-preview.yml"
      - "scripts/fetch_rental_preview.py"
      - "scripts/fetch_houseprice_rental_vpn.py"
      - "scripts/preflight_houseprice_rental_vpn.py"
      - "scripts/stamp_rental_first_seen.py"
      - "trigger/rental-preview-wakeup.txt"

permissions:
  contents: write
  pages: write

concurrency:
  group: banqiao-rental-preview-v4
  cancel-in-progress: true

jobs:
  rental-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install crawler packages
        run: |
          python -m pip install requests beautifulsoup4 playwright curl_cffi
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq wireguard-tools

      - name: Preserve previous rental first-seen data
        shell: bash
        run: |
          if [[ -f docs/preview/rental-data.json ]]; then
            cp docs/preview/rental-data.json /tmp/rental-data-previous.json
          fi

      - name: Fetch Preview rental listings
        id: fetch
        continue-on-error: true
        env:
          SKIP_HOUSEPRICE: "1"
        shell: bash
        run: |
          set +e
          timeout 150 python scripts/fetch_rental_preview.py > /tmp/rental-fetch.log 2>&1
          rc=$?
          cat /tmp/rental-fetch.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Find Surfshark exit accepted by 5168
        id: vpn
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/houseprice-vpn-preflight.log
          for attempt in 1 2 3 4 5; do
            echo "5168 Surfshark attempt $attempt/5" | tee -a /tmp/houseprice-vpn-preflight.log
            timeout 20 sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if timeout 45 bash scripts/connect_surfshark_wireguard.sh; then
              if timeout 15 python scripts/preflight_houseprice_rental_vpn.py 2>&1 | tee -a /tmp/houseprice-vpn-preflight.log; then
                echo "5168 accepted this Surfshark exit." | tee -a /tmp/houseprice-vpn-preflight.log
                exit 0
              fi
              echo "5168 rejected this exit; rotating." | tee -a /tmp/houseprice-vpn-preflight.log
            fi
            timeout 20 sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          echo "No usable Surfshark exit found for 5168." | tee -a /tmp/houseprice-vpn-preflight.log
          exit 1

      - name: Fetch 5168 rentals through VPN
        id: houseprice_vpn
        if: steps.fetch.outcome == 'success' && steps.vpn.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout 90 python scripts/fetch_houseprice_rental_vpn.py > /tmp/houseprice-vpn.log 2>&1
          rc=$?
          cat /tmp/houseprice-vpn.log
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: timeout 20 sudo wg-quick down surfshark || true

      - name: Restore last-good 5168 rental snapshot when VPN refresh fails
        if: steps.fetch.outcome == 'success' && steps.houseprice_vpn.outcome != 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cur_path=Path('docs/preview/rental-data.json')
          last_path=Path('docs/preview/rental-houseprice-last-good.json')
          if not cur_path.exists() or not last_path.exists():
              raise SystemExit('Missing rental current or 5168 last-good snapshot')
          cur=json.loads(cur_path.read_text(encoding='utf-8'))
          last=json.loads(last_path.read_text(encoding='utf-8'))
          rows=[x for x in (cur.get('listings') or []) if x.get('source')!='5168']
          hp=list(last.get('listings') or [])
          rows.extend(hp)
          seen=set(); dedup=[]
          for x in rows:
              key=x.get('id') or (x.get('source'),x.get('houseId'))
              if key in seen: continue
              seen.add(key); dedup.append(x)
          old_run=dict(last.get('run') or {})
          cur.setdefault('runs',{})['5168']={
              **old_run,
              'status':'error',
              'totalCount':len(hp),
              'checkedAt':last.get('updatedAt'),
              'message':'本輪找不到 5168 可用 VPN 出口；沿用最後成功快照，未以 0 筆覆蓋。',
              'logs':['本輪 VPN/API 更新失敗，保留最後成功 5168 租屋資料。'] + list(old_run.get('logs') or []),
          }
          counts=cur.setdefault('counts',{})
          counts['houseprice']=len(hp)
          counts['total']=len(dedup)
          roads=cur.get('watchRoads') or []
          counts['roads']={road:sum(1 for x in dedup if x.get('road')==road) for road in roads}
          cur['listings']=dedup
          cur_path.write_text(json.dumps(cur,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'restored5168':len(hp),'lastGoodAt':last.get('updatedAt')},ensure_ascii=False))
          PY

      - name: Stamp first-seen time from our monitor
        id: stamp
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: python scripts/stamp_rental_first_seen.py

      - name: Write rental Preview diagnostics
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          FETCH_RC: ${{ steps.fetch.outputs.rc }}
          VPN_OUTCOME: ${{ steps.vpn.outcome }}
          HOUSEPRICE_VPN_OUTCOME: ${{ steps.houseprice_vpn.outcome }}
          HOUSEPRICE_VPN_RC: ${{ steps.houseprice_vpn.outputs.rc }}
          STAMP_OUTCOME: ${{ steps.stamp.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          log=''
          p=Path('/tmp/rental-fetch.log')
          if p.exists(): log=p.read_text(encoding='utf-8', errors='replace')[-12000:]
          hp=''
          hp_path=Path('/tmp/houseprice-vpn.log')
          if hp_path.exists(): hp=hp_path.read_text(encoding='utf-8', errors='replace')[-8000:]
          preflight=''
          pf=Path('/tmp/houseprice-vpn-preflight.log')
          if pf.exists(): preflight=pf.read_text(encoding='utf-8', errors='replace')[-6000:]
          data={
            'checkedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'fetchOutcome':os.getenv('FETCH_OUTCOME'),
            'fetchReturnCode':os.getenv('FETCH_RC'),
            'vpnOutcome':os.getenv('VPN_OUTCOME'),
            'housepriceVpnOutcome':os.getenv('HOUSEPRICE_VPN_OUTCOME'),
            'housepriceVpnReturnCode':os.getenv('HOUSEPRICE_VPN_RC'),
            'stampOutcome':os.getenv('STAMP_OUTCOME'),
            'rentalDataExists':Path('docs/preview/rental-data.json').exists(),
            'uiOwnership':'canonical-preview-index',
            'logTail':log,
            'housepriceVpnLogTail':hp,
            'housepriceVpnPreflightLogTail':preflight,
          }
          Path('docs/preview/rental-run-diagnostic.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False))
          PY

      - name: Save rental data and diagnostics only
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/rental-run-diagnostic.json /tmp/rental-run-diagnostic.json
          [[ -f docs/preview/rental-data.json ]] && cp docs/preview/rental-data.json /tmp/rental-data.json || true
          [[ -f docs/preview/rental-houseprice-last-good.json ]] && cp docs/preview/rental-houseprice-last-good.json /tmp/rental-houseprice-last-good.json || true

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/rental-run-diagnostic.json docs/preview/rental-run-diagnostic.json
          [[ -f /tmp/rental-data.json ]] && cp /tmp/rental-data.json docs/preview/rental-data.json || true
          [[ -f /tmp/rental-houseprice-last-good.json ]] && cp /tmp/rental-houseprice-last-good.json docs/preview/rental-houseprice-last-good.json || true

          git add docs/preview/rental-run-diagnostic.json
          [[ -f docs/preview/rental-data.json ]] && git add docs/preview/rental-data.json || true
          [[ -f docs/preview/rental-houseprice-last-good.json ]] && git add docs/preview/rental-houseprice-last-good.json || true
          if git diff --cached --quiet; then
            echo "No rental Preview changes."
          else
            git commit -m "Update rental Preview data"
            git push
          fi

      - name: Request GitHub Pages rebuild
        if: steps.fetch.outcome == 'success' && steps.stamp.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/builds"

      - name: Fail if rental data did not build
        if: steps.fetch.outcome != 'success' || steps.stamp.outcome != 'success' || steps.houseprice_vpn.outcome != 'success'
        run: exit 1
