name: 591 路段診斷測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_591_streets.py"
      - ".github/workflows/test-591.yml"

permissions:
  contents: write

jobs:
  test-591:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Test 591 mobile street URLs
        run: |
          mkdir -p diagnostics
          python scripts/test_591_streets.py | tee diagnostics/591_test.txt

      - name: Compare desktop and API endpoints
        run: |
          python - <<'PY' | tee -a diagnostics/591_test.txt
          import json, re, requests
          from bs4 import BeautifulSoup

          roads = {
              "中山路二段":"27507",
              "三民路二段":"27485",
              "光復街":"27550",
              "萬安街":"27630",
              "林森街":"27574",
              "三民路一段":"27484",
              "翠華街":"27644",
          }
          headers = {
              "Accept":"text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8",
              "Accept-Language":"zh-TW,zh;q=0.9,en;q=0.7",
              "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36",
              "Referer":"https://sale.591.com.tw/",
          }
          s = requests.Session()
          print("="*90)
          print("DESKTOP / API COMPARISON")
          for road, streetid in roads.items():
              tests = [
                  ("desktop-user-style", "https://sale.591.com.tw/", {
                      "regionid":"3", "sectionidStr":"26", "o":"32", "streetid":streetid, "keywords":road,
                  }),
                  ("desktop-old-style", "https://sale.591.com.tw/", {
                      "regionid":"3", "section":"26", "shType":"list", "order":"posttime_desc", "streetid":streetid, "keywords":road,
                  }),
                  ("search-api", "https://sale.591.com.tw/home/search/list", {
                      "type":"1", "regionid":"3", "section":"26", "streetid":streetid, "keywords":road,
                      "order":"posttime_desc", "firstRow":"0", "totalRows":"30",
                  }),
              ]
              print("-"*90)
              print(f"ROAD={road} streetid={streetid}")
              for label, url, params in tests:
                  try:
                      r = s.get(url, params=params, headers=headers, timeout=30)
                      text = r.text
                      ct = r.headers.get("content-type", "")
                      title = "-"
                      if "html" in ct.lower() or text.lstrip().startswith("<"):
                          soup = BeautifulSoup(text, "html.parser")
                          title = (soup.title.get_text(" ", strip=True) if soup.title else "-")[:90]
                      ids = sorted(set(re.findall(r"house(?:_?id)?[^0-9]{0,20}(\d{5,})", text, re.I)))
                      detail = sorted(set(re.findall(r"(?:detail/\d/|/home/|/sale/)(\d{5,})", text, re.I)))
                      print(f"{label}: HTTP={r.status_code} bytes={len(text)} ct={ct[:45]} title={title}")
                      print(f"  houseid={len(ids)} sample={ids[:6]} detail={len(detail)} sample={detail[:6]}")
                      if "json" in ct.lower() or text.lstrip().startswith(("{","[")):
                          try:
                              data = r.json()
                              if isinstance(data, dict):
                                  print(f"  json_keys={list(data.keys())[:15]}")
                                  blob = json.dumps(data, ensure_ascii=False)
                                  print(f"  json_houseid_tokens={len(set(re.findall(r'house(?:_?id)?[^0-9]{0,20}(\\d{5,})', blob, re.I)))}")
                          except Exception as exc:
                              print(f"  json_parse_error={exc}")
                  except Exception as exc:
                      print(f"{label}: ERROR={exc}")
          PY

      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/591_test.txt
          git diff --cached --quiet || git commit -m "Update 591 diagnostic result"
          git push
