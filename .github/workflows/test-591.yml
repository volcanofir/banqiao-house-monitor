name: 591 路段診斷測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/test_591_streets.py"
      - ".github/workflows/test-591.yml"

permissions:
  contents: write

jobs:
  test-591:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Test 591 street URLs
        run: |
          mkdir -p diagnostics
          python scripts/test_591_streets.py | tee diagnostics/591_test.txt

      - name: Save diagnostic result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/591_test.txt
          git diff --cached --quiet || git commit -m "Update 591 diagnostic result"
          git push
