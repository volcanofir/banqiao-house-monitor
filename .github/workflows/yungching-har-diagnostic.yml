name: 永慶 HAR API 診斷

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-har-diagnostic.yml"
      - "scripts/record_yungching_har.py"
      - "scripts/analyze_yungching_har_bundles.py"
      - "scripts/yungching_html_transport_probe.py"
      - "scripts/yungching_internal_api_probe.py"
      - "scripts/yungching_browser_preflight.py"
      - "scripts/connect_surfshark_wireguard.sh"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-har-diagnostic
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install chromium

      - name: Connect Surfshark and verify Yongching Chromium
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            echo "Surfshark HAR attempt $attempt/5" | tee -a /tmp/yungching-har-run.log
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh 2>&1 | tee -a /tmp/yungching-har-run.log && python scripts/yungching_browser_preflight.py 2>&1 | tee -a /tmp/yungching-har-run.log; then
              echo "Surfshark exit accepted by Yongching Chromium." | tee -a /tmp/yungching-har-run.log
              exit 0
            fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Record search page 1, page 2 and one detail page to HAR
        shell: bash
        run: |
          set -o pipefail
          python scripts/record_yungching_har.py 2>&1 | tee -a /tmp/yungching-har-run.log

      - name: Discover hidden public routes from captured JavaScript bundles
        shell: bash
        run: |
          set -o pipefail
          python scripts/analyze_yungching_har_bundles.py 2>&1 | tee -a /tmp/yungching-har-run.log

      - name: Deep inspect server HTML versus rendered DOM
        shell: bash
        run: |
          set -o pipefail
          python scripts/yungching_html_transport_probe.py 2>&1 | tee -a /tmp/yungching-har-run.log

      - name: Probe SSR-exposed Yongching APIs directly
        shell: bash
        run: |
          set -o pipefail
          python scripts/yungching_internal_api_probe.py 2>&1 | tee -a /tmp/yungching-har-run.log

      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Upload full HAR as short-lived diagnostic artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yungching-network-har
          path: artifacts/yungching-har/yungching-network.har
          if-no-files-found: warn
          retention-days: 7

      - name: Save sanitized HAR and HTML transport summaries
        if: success()
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/yungching-har-summary.json /tmp/yungching-har-summary.json
          cp docs/preview/yungching-har-bundle-routes.json /tmp/yungching-har-bundle-routes.json
          cp docs/preview/yungching-html-transport-probe.json /tmp/yungching-html-transport-probe.json
          cp docs/preview/yungching-internal-api-probe.json /tmp/yungching-internal-api-probe.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/yungching-har-summary.json docs/preview/yungching-har-summary.json
          cp /tmp/yungching-har-bundle-routes.json docs/preview/yungching-har-bundle-routes.json
          cp /tmp/yungching-html-transport-probe.json docs/preview/yungching-html-transport-probe.json
          cp /tmp/yungching-internal-api-probe.json docs/preview/yungching-internal-api-probe.json
          git add docs/preview/yungching-har-summary.json docs/preview/yungching-har-bundle-routes.json docs/preview/yungching-html-transport-probe.json docs/preview/yungching-internal-api-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save deep Yongching transport diagnostic"
          git push origin HEAD:main

      - name: Save HAR failure diagnostic
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          log=Path('/tmp/yungching-har-run.log').read_text(encoding='utf-8') if Path('/tmp/yungching-har-run.log').exists() else ''
          out={
            'capturedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'passed':False,
            'logTail':log[-12000:],
            'harExists':Path('artifacts/yungching-har/yungching-network.har').exists(),
            'harBytes':Path('artifacts/yungching-har/yungching-network.har').stat().st_size if Path('artifacts/yungching-har/yungching-network.har').exists() else 0,
            'bundleRouteProbeExists':Path('docs/preview/yungching-har-bundle-routes.json').exists(),
            'htmlTransportProbeExists':Path('docs/preview/yungching-html-transport-probe.json').exists(),
            'internalApiProbeExists':Path('docs/preview/yungching-internal-api-probe.json').exists(),
          }
          Path('/tmp/yungching-har-failed.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/yungching-har-failed.json docs/preview/yungching-har-failed.json
          git add docs/preview/yungching-har-failed.json
          if ! git diff --cached --quiet; then
            git commit -m "Save failed Yongching HAR diagnostic"
            git push origin HEAD:main || true
          fi
