name: 5168 APK endpoint probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/houseprice_apk_probe.py"
      - ".github/workflows/houseprice-apk-probe.yml"
permissions:
  contents: write
concurrency:
  group: houseprice-apk-endpoint-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq apktool
      - run: python scripts/houseprice_apk_probe.py
      - name: Save endpoint report only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/houseprice-apk-endpoints.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save 5168 APK endpoint probe"
          git pull --rebase
          git push
