name: 樂屋七路段測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-rakuya-seven-roads.yml"
      - "scripts/test_rakuya_seven_roads.py"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/test_rakuya_seven_roads.py
