name: 591 Surfshark Two-at-a-Time Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tests/trigger-591-sequential.txt"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  batch1:
    name: 1-2 中山二段 + 三民二段
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 playwright
      - name: Connect Surfshark Taiwan WireGuard
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh
      - name: Test two roads in parallel
        run: |
          ROAD="板橋區中山路二段" STREET_ID="27507" OUTPUT="road1.json" python scripts/test_591_matrix_road.py &
          p1=$!
          ROAD="板橋區三民路二段" STREET_ID="27485" OUTPUT="road2.json" python scripts/test_591_matrix_road.py &
          p2=$!
          wait "$p1"
          wait "$p2"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road1, path: road1.json, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road2, path: road2.json, if-no-files-found: warn}

  batch2:
    name: 3-4 光復街 + 萬安街
    needs: batch1
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 playwright
      - name: Connect Surfshark Taiwan WireGuard
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh
      - name: Test two roads in parallel
        run: |
          ROAD="板橋區光復街" STREET_ID="27550" OUTPUT="road3.json" python scripts/test_591_matrix_road.py &
          p1=$!
          ROAD="板橋區萬安街" STREET_ID="27630" OUTPUT="road4.json" python scripts/test_591_matrix_road.py &
          p2=$!
          wait "$p1"
          wait "$p2"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road3, path: road3.json, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road4, path: road4.json, if-no-files-found: warn}

  batch3:
    name: 5-6 林森街 + 三民一段
    needs: batch2
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 playwright
      - name: Connect Surfshark Taiwan WireGuard
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh
      - name: Test two roads in parallel
        run: |
          ROAD="板橋區林森街" STREET_ID="27574" OUTPUT="road5.json" python scripts/test_591_matrix_road.py &
          p1=$!
          ROAD="板橋區三民路一段" STREET_ID="27484" OUTPUT="road6.json" python scripts/test_591_matrix_road.py &
          p2=$!
          wait "$p1"
          wait "$p2"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road5, path: road5.json, if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road6, path: road6.json, if-no-files-found: warn}

  batch4:
    name: 7 翠華街
    needs: batch3
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4 playwright
      - name: Connect Surfshark Taiwan WireGuard
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: bash scripts/connect_surfshark_wireguard.sh
      - name: Test road
        env:
          ROAD: "板橋區翠華街"
          STREET_ID: "27644"
          OUTPUT: "road7.json"
        run: python scripts/test_591_matrix_road.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: road7, path: road7.json, if-no-files-found: warn}

  summary:
    name: Summary
    needs: [batch1, batch2, batch3, batch4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: road*
          path: results
      - name: Build persistent summary
        run: |
          python - <<'PY'
          import glob, json
          from datetime import datetime, timezone
          from pathlib import Path

          order = {
              '板橋區中山路二段': 1,
              '板橋區三民路二段': 2,
              '板橋區光復街': 3,
              '板橋區萬安街': 4,
              '板橋區林森街': 5,
              '板橋區三民路一段': 6,
              '板橋區翠華街': 7,
          }
          files = glob.glob('results/**/*.json', recursive=True)
          rows = []
          for f in files:
              try:
                  rows.append(json.load(open(f, encoding='utf-8')))
              except Exception as exc:
                  rows.append({'road': f, 'success': False, 'count': 0, 'pages': 0, 'logs': [f'讀取結果失敗：{exc}']})
          rows.sort(key=lambda r: order.get(r.get('road'), 999))

          starts = [r.get('startedAt') for r in rows if r.get('startedAt')]
          finishes = [r.get('finishedAt') for r in rows if r.get('finishedAt')]
          total_duration = None
          if starts and finishes:
              try:
                  s = min(datetime.fromisoformat(x) for x in starts)
                  e = max(datetime.fromisoformat(x) for x in finishes)
                  total_duration = round((e - s).total_seconds(), 2)
              except Exception:
                  pass

          exit_ips = sorted({r.get('vpnExitIp') for r in rows if r.get('vpnExitIp')})
          report = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'mode': 'surfshark_taiwan_wireguard_two_roads_per_runner',
              'vpnExpected': True,
              'vpnVerifiedForAllResults': len(rows) == 7 and all(bool(r.get('vpnConnected')) and bool(r.get('vpnExitIp')) for r in rows),
              'vpnExitIps': exit_ips,
              'successCount': sum(bool(r.get('success')) for r in rows),
              'totalRoads': 7,
              'receivedResults': len(rows),
              'allSucceeded': len(rows) == 7 and all(bool(r.get('success')) for r in rows),
              'totalDurationSeconds': total_duration,
              'results': rows,
              'productionDataModified': False,
          }
          out = Path('docs/data/591-two-at-time-test.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Save test report to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/591-two-at-time-test.json
          git diff --cached --quiet || git commit -m "Update 591 Surfshark VPN test report"
          git pull --rebase
          git push
