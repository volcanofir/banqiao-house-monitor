name: Independent Preview source refresh
run-name: preview-source:${{ inputs.source }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: The ONE Preview source to refresh; no full property regrouping
        type: choice
        required: true
        options:
          - sinyi
          - rakuya
          - houseprice

permissions:
  contents: write
  pages: write

concurrency:
  group: banqiao-preview-source-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  refresh-one-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Verify retry and no-false-delisting rules
        run: |
          python -m unittest discover -s tests -p test_preview_source_retry_gate.py -v
          python -m py_compile scripts/refresh_sinyi_preview_source.py scripts/preview_source_retry_gate.py

      - name: Refresh only selected source
        shell: bash
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            sinyi)
              python scripts/run_with_system_chrome.py scripts/refresh_sinyi_preview_source.py
              file=docs/preview/sinyi-source.json
              ;;
            rakuya)
              python scripts/fetch_rakuya_seven_roads_preview.py
              python scripts/validate_rakuya_preview_snapshot.py
              file=docs/preview/rakuya-seven-roads.json
              ;;
            houseprice)
              python scripts/fetch_houseprice_seven_roads_preview.py
              python scripts/validate_houseprice_preview_snapshot.py
              file=docs/preview/houseprice-seven-roads.json
              ;;
            *) echo "::error::Unsupported source"; exit 1 ;;
          esac
          # No canonical, company comparison, or HTML updates are allowed.
          unexpected="$(git status --porcelain -- docs/data docs/index.html docs/preview/index.html state)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Independent source mutated protected files: $unexpected"
            exit 1
          fi
          cp "$file" /tmp/preview-independent-source.json
          echo "file=$file" >> "$GITHUB_ENV"

      - name: Publish only complete verified source snapshot
        env:
          SOURCE: ${{ inputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$(dirname "$file")"
            # Never overwrite a newer independently verified capture.
            if python - "$file" /tmp/preview-independent-source.json <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          old, new = (Path(x) for x in sys.argv[1:3])
          payload = json.loads(new.read_text(encoding="utf-8"))
          if payload.get("complete") is not True:
              raise SystemExit("Refuse incomplete source snapshot")
          if old.exists():
              previous = json.loads(old.read_text(encoding="utf-8"))
              def stamp(obj):
                  raw = obj.get("updatedAt")
                  if not raw:
                      return None
                  d = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              earlier, incoming = stamp(previous), stamp(payload)
              if earlier and incoming and earlier >= incoming:
                  print("Newer or identical source snapshot is already published; skip")
                  raise SystemExit(3)
          PY
            then
              echo "Verified source is newer than the repository snapshot."
            else
              rc=$?
              if [[ "$rc" == 3 ]]; then
                echo "Keep the newer published snapshot; nothing to overwrite."
                exit 0
              fi
              echo "::error::Source freshness/validation guard failed ($rc)."
              exit "$rc"
            fi
            cp /tmp/preview-independent-source.json "$file"
            git add "$file"
            if git diff --cached --quiet; then
              echo "Source snapshot unchanged."
              exit 0
            fi
            git commit -m "Refresh independent verified $SOURCE Preview source"
            if git push origin HEAD:main; then
              echo "Updated only $file. Grouping and delisting remain unchanged."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Could not publish $SOURCE after three retries."
          exit 1

      - name: Request Pages source status refresh
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
