name: Independent Preview source refresh
run-name: preview-source:${{ inputs.source || 'sinyi' }}

on:
  workflow_dispatch:
    inputs:
      source:
        description: The ONE Preview source to refresh; no full property regrouping
        type: choice
        required: true
        options:
          - sinyi
          - rakuya
          - houseprice
  # Backup Sinyi schedule: even a broken full CLEAN monitor cannot stop source refresh.
  # Normal per-source cadence and 30-minute failure retries still run via monitor-clean.
  schedule:
    - cron: "23 */3 * * *"
  # Workflow changes immediately check the independently published feed.
  push:
    branches: [main]
    paths:
      - ".github/workflows/preview-source-refresh.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: banqiao-preview-source-${{ inputs.source || 'sinyi' }}
  cancel-in-progress: false

jobs:
  refresh-one-source:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout latest repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Verify retry and no-false-delisting rules
        run: |
          python -m unittest discover -s tests -p test_preview_source_retry_gate.py -v
          python -m unittest discover -s tests -p test_sinyi_independent_preview.py -v
          python -m py_compile scripts/refresh_sinyi_preview_source.py scripts/preview_source_retry_gate.py

      - name: Skip redundant scheduled Sinyi crawl when the feed is recent
        id: backup_gate
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path("docs/preview/sinyi-source.json")
          due = True
          try:
              obj = json.loads(path.read_text(encoding="utf-8"))
              if obj.get("complete") is True and obj.get("source") == "信義房屋" and (obj.get("runs") or {}).get("信義房屋", {}).get("status") == "ok":
                  t = datetime.fromisoformat(obj["updatedAt"].replace("Z", "+00:00"))
                  age = (datetime.now(timezone.utc) - t.astimezone(timezone.utc)).total_seconds() / 60
                  due = not (-5 <= age < 180)
          except (OSError, ValueError, KeyError, TypeError) as exc:
              print(f"Missing/invalid backup snapshot: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("due=" + str(due).lower() + "\n")
          print(f"Independent Sinyi backup due={due}")
          PY

      - name: Refresh only selected source
        if: github.event_name != 'schedule' || steps.backup_gate.outputs.due == 'true'
        shell: bash
        env:
          SOURCE: ${{ inputs.source || 'sinyi' }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            sinyi)
              python scripts/run_with_system_chrome.py scripts/refresh_sinyi_preview_source.py
              file=docs/preview/sinyi-source.json
              ;;
            rakuya)
              python scripts/fetch_rakuya_seven_roads_preview.py
              python scripts/validate_rakuya_preview_snapshot.py
              file=docs/preview/rakuya-seven-roads.json
              ;;
            houseprice)
              python scripts/fetch_houseprice_seven_roads_preview.py
              python scripts/validate_houseprice_preview_snapshot.py
              file=docs/preview/houseprice-seven-roads.json
              ;;
            *) echo "::error::Unsupported source"; exit 1 ;;
          esac
          # No canonical, company comparison, or HTML updates are allowed.
          unexpected="$(git status --porcelain -- docs/data docs/index.html docs/preview/index.html state)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Independent source mutated protected files: $unexpected"
            exit 1
          fi
          cp "$file" /tmp/preview-independent-source.json
          echo "file=$file" >> "$GITHUB_ENV"

      - name: Publish only complete verified source snapshot
        if: github.event_name != 'schedule' || steps.backup_gate.outputs.due == 'true'
        env:
          SOURCE: ${{ inputs.source || 'sinyi' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A newly scraped file might be untracked; reset --hard leaves it in place.
            # Always compare against the actual REMOTE committed source, not local files.
            remote_file=/tmp/preview-remote-source.json
            if git cat-file -e "origin/main:$file" 2>/dev/null; then
              git show "origin/main:$file" > "$remote_file"
            else
              rm -f "$remote_file"
            fi
            mkdir -p "$(dirname "$file")"
            # Never overwrite a newer independently verified capture.
            if python - "$remote_file" /tmp/preview-independent-source.json <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path

          old, new = (Path(x) for x in sys.argv[1:3])
          payload = json.loads(new.read_text(encoding="utf-8"))
          if payload.get("complete") is not True:
              raise SystemExit("Refuse incomplete source snapshot")
          if old.exists():
              previous = json.loads(old.read_text(encoding="utf-8"))
              def stamp(obj):
                  raw = obj.get("updatedAt")
                  if not raw:
                      return None
                  d = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  return d if d.tzinfo else d.replace(tzinfo=timezone.utc)
              earlier, incoming = stamp(previous), stamp(payload)
              if earlier and incoming and earlier >= incoming:
                  print("Newer or identical source snapshot is already published; skip")
                  raise SystemExit(3)
          PY
            then
              echo "Verified source is newer than the repository snapshot."
            else
              rc=$?
              if [[ "$rc" == 3 ]]; then
                echo "Keep the newer published snapshot; nothing to overwrite."
                exit 0
              fi
              echo "::error::Source freshness/validation guard failed ($rc)."
              exit "$rc"
            fi
            cp /tmp/preview-independent-source.json "$file"
            git add "$file"
            if git diff --cached --quiet; then
              echo "Source snapshot unchanged."
              exit 0
            fi
            git commit -m "Refresh independent verified $SOURCE Preview source"
            if git push origin HEAD:main; then
              echo "Updated only $file. Grouping and delisting remain unchanged."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Could not publish $SOURCE after three retries."
          exit 1

      # Every successful source-file commit already triggers branch-based GitHub Pages.
      # Do not call /pages/builds a second time: duplicate builds can pile up and
      # repeatedly cancel the deployment that would make the source visible.

      - name: Verify Sinyi exists on GitHub and the public Preview serves it
        if: success() && (github.event_name != 'schedule' || steps.backup_gate.outputs.due == 'true')
        env:
          SOURCE: ${{ inputs.source || 'sinyi' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE" == "sinyi" ]]; then
            python -m unittest discover -s tests -p "test_verify_sinyi_publication.py" -v
            python scripts/verify_sinyi_publication.py \
              --expected /tmp/preview-independent-source.json \
              --check-git --check-pages --retries 30 --delay 10
          else
            echo "Sinyi-only public publication check skipped for $SOURCE."
          fi
