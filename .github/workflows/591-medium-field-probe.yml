name: 591 medium-risk field probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_591_medium_fields.py"
      - ".github/workflows/591-medium-field-probe.yml"

permissions:
  contents: write

concurrency:
  group: banqiao-591-medium-field-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install chromium
      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh; then exit 0; fi
            sleep 4
          done
          exit 1
      - name: Probe 591 structured fields for medium-risk groups
        run: python scripts/probe_591_medium_fields.py
      - name: Disconnect VPN
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/preview/591-medium-field-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save 591 medium-risk field probe"
          git pull --rebase
          git push
