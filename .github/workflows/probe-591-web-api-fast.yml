name: 591 desktop web API speed probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_591_web_api_fast.py"
      - ".github/workflows/probe-591-web-api-fast.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install probe dependencies
        run: pip install requests beautifulsoup4 playwright

      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        run: |
          bash scripts/connect_surfshark_wireguard.sh

      - name: Run isolated 591 web API probe
        run: python scripts/probe_591_web_api_fast.py

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: 591-web-api-fast-report
          path: artifacts/591-web-api-fast-report.json
          retention-days: 7

      - name: Disconnect Surfshark
        if: always()
        run: sudo wg-quick down surfshark || true
