name: 591 wareList feed for original Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/591-warelist-preview.yml"
      - "scripts/build_591_warelist_preview.py"
      - "tests/test_591_warelist_preview.py"
  schedule:
    # Independent GitHub cloud crawl about once every three hours (UTC).
    - cron: "23 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: banqiao-591-warelist-preview
  cancel-in-progress: false

jobs:
  refresh-independent-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install public-list capture and parser dependencies
        run: pip install playwright requests beautifulsoup4

      - name: Run offline safety unit tests
        run: |
          python -m py_compile scripts/build_591_warelist_preview.py
          python -m unittest discover -s tests -p "test_591_warelist_preview.py" -v

      - name: Read and validate all seven 591 roads
        run: python -u scripts/build_591_warelist_preview.py

      - name: Assert original production and Preview are unchanged
        run: |
          if [[ -n "$(git status --porcelain -- docs/data docs/preview docs/index.html state)" ]]; then
            echo "::error::Source test mutated protected canonical data or Preview"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("docs/591-preview/snapshot.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("mode")=="preview_only"
          assert d.get("complete") is True
          assert d.get("noOffmarketDecision") is True
          assert d.get("noAutomaticNewPropertyDecision") is True
          assert len(d.get("roadCounts") or []) == 7
          assert len(d.get("listings") or []) == d.get("counts",{}).get("totalListings")
          print("Verified seven-road Preview-only snapshot, no canonical modification")
          PY

      - name: Publish only 591 data feed for original Preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/591-preview/snapshot.json /tmp/591-warelist-preview-snapshot.json
          git fetch origin main
          # Historical data refreshes every ~15 minutes for other sources.
          # Only a 591 *historical identity/status change* makes this read-only
          # capture invalid; a Sinyi-only canonical commit should not discard it.
          if [[ "$(git rev-parse HEAD:scripts/build_591_warelist_preview.py)" != "$(git rev-parse origin/main:scripts/build_591_warelist_preview.py)" ]]; then
            echo "::warning::591 parser changed while crawling; skip stale preview publish"
            exit 0
          fi
          if [[ "$(git rev-parse HEAD:docs/data/listings.json)" != "$(git rev-parse origin/main:docs/data/listings.json)" ]]; then
            python - <<'PY'
          import json,subprocess
          def read(ref):
              b=subprocess.check_output(["git","show",f"{ref}:docs/data/listings.json"])
              return json.loads(b)
          def only_591(d):
              return [x for x in d.get("listings",[]) if x.get("source")=="591"]
          original=only_591(read("HEAD"))
          latest=only_591(read("origin/main"))
          if original != latest:
              raise SystemExit("591 historical records changed; refuse stale publication")
          print("Other-source changes occurred but exact historical 591 records are unchanged; safe to refresh")
          PY
          fi
          git reset --hard origin/main
          mkdir -p docs/591-preview
          cp /tmp/591-warelist-preview-snapshot.json docs/591-preview/snapshot.json
          git add docs/591-preview/snapshot.json
          if git diff --cached --quiet; then
            echo "Preview data unchanged; publishing unnecessary."
            exit 0
          fi
          git commit -m "Refresh independent verified 591 wareList Preview"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "591 data feed saved for existing /preview/ grouping; canonical history untouched."
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 3
          done
          echo "::error::Could not publish verified 591 feed after three retries."
          exit 1

      - name: Rebuild the EXISTING /preview/ with newly captured 591 data
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Quickly rebuild the SAME existing /preview/ using a verified
          # recently captured company snapshot. This avoids needing a fresh
          # Surfshark exit just to show already verified 591 data.
          if gh workflow run rebuild-original-preview-from-verified-snapshot.yml --ref main; then
            echo "Fast verified rebuild of existing /preview/ dispatched."
          else
            echo "::warning::Fast cached-company rebuild unavailable; full original Preview crawl will still run."
          fi
          # Full live company comparison remains an independent backstop.
          gh workflow run yungching-preview.yml --ref main
          echo "Dispatched full original /preview/ property grouping; no separate website."
