name: 方案 A 已驗證官方快照完成測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheme-a-current-snapshot-test.yml"
      - "scripts/yungching_dom_snapshot_v4.py"
      - "scripts/yungching_detail_floor_enrich.py"
      - "scripts/compare_yungching_preview_v6.py"
      - "scripts/patch_preview_ui.py"
      - "scripts/validate_scheme_a_preview.py"

permissions:
  contents: write

# Diagnostic only. Never writes canonical Preview files.
concurrency:
  group: banqiao-scheme-a-current-snapshot-diagnostic
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 playwright cryptography
          python -m playwright install chromium

      - name: Remove impossible cross-road Yongching IDs from current snapshot copy
        run: python scripts/yungching_dom_snapshot_v4.py --sanitize-existing

      - name: Connect Surfshark for official Yongching detail pages
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then exit 0; fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1

      - name: Enrich floors and YC case IDs on cleaned snapshot copy
        run: python scripts/yungching_detail_floor_enrich.py

      - name: Disconnect Surfshark
        if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true

      - name: Run scheme A comparison in diagnostic workspace
        shell: bash
        run: |
          set -o pipefail
          python scripts/compare_yungching_preview_v6.py 2>&1 | tee docs/preview/yungching-preview-run.log
          python scripts/patch_preview_ui.py
          python scripts/validate_scheme_a_preview.py

      - name: Write snapshot diagnostic verification
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=json.loads(Path('docs/preview/company-gap.json').read_text(encoding='utf-8'))
          s=json.loads(Path('docs/preview/yungching-browser-snapshot.json').read_text(encoding='utf-8'))
          candidates=[x.get('companyCandidate') for x in (p.get('comparisons') or []) if x.get('companyCandidate')]
          out={
            'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'scheme':'A',
            'diagnosticOnly':True,
            'source':'current saved official snapshot copy + official detail pages',
            'snapshotCapturedAt':s.get('capturedAt'),
            'companySnapshotCapturedAt':p.get('companySnapshotCapturedAt'),
            'fetchMode':p.get('fetchMode'),
            'browserListingCount':s.get('listingCount'),
            'companyListingCount':p.get('companyListingCount'),
            'propertyGroupCount':p.get('propertyGroupCount'),
            'rawListingCount':p.get('rawListingCount'),
            'counts':p.get('counts'),
            'roadCounts':{r:(st or {}).get('count') for r,st in (s.get('roadStatus') or {}).items()},
            'idIntegrityGuard':s.get('idIntegrityGuard'),
            'candidateCount':len(candidates),
            'candidatesWithFloor':sum(1 for x in candidates if x.get('floor')),
            'candidatesWithYcCaseId':sum(1 for x in candidates if x.get('officialCaseId')),
            'detailFloorEnrichment':s.get('detailFloorEnrichment'),
            'legacyFallbacks':False,
            'passed':True,
          }
          Path('docs/preview/scheme-a-snapshot-verification.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Save snapshot diagnostic only
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/scheme-a-snapshot-verification.json /tmp/scheme-a-snapshot-verification.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/scheme-a-snapshot-verification.json docs/preview/scheme-a-snapshot-verification.json
          git add docs/preview/scheme-a-snapshot-verification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save scheme A snapshot diagnostic"
          git push origin HEAD:main
