name: 永慶樓層固定案例 Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/yungching-floor-regression.yml"
      - "scripts/yungching_detail_floor_enrich.py"

permissions:
  contents: write

concurrency:
  group: banqiao-yungching-floor-regression
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install playwright requests beautifulsoup4
          python -m playwright install chromium
      - name: Connect Surfshark
        env:
          SURFSHARK_WG_CONFIG: ${{ secrets.SURFSHARK_WG_CONFIG }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            if bash scripts/connect_surfshark_wireguard.sh && python scripts/yungching_browser_preflight.py; then exit 0; fi
            sudo wg-quick down surfshark >/dev/null 2>&1 || true
            sleep 3
          done
          exit 1
      - name: Capture fixed current-property floors
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          from datetime import datetime, timezone
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          sys.path.insert(0, str(Path('scripts').resolve()))
          import yungching_detail_floor_enrich as f

          cases=[
            {'id':'6935425','expected_floor':'3/14樓','expected_case':'YC1239410'},
            {'id':'6857079','expected_subject':1},
            {'id':'6693666','expected_subject':3},
          ]
          results=[]
          with sync_playwright() as p:
            b=p.chromium.launch(headless=True)
            c=b.new_context(locale='zh-TW', timezone_id='Asia/Taipei')
            page=c.new_page()
            for case in cases:
              row={'id':case['id']}
              try:
                url=f"https://buy.yungching.com.tw/house/{case['id']}"
                r=page.goto(url, wait_until='domcontentloaded', timeout=35000)
                official=f.response_text(r)
                f.render_full_detail(page)
                focused,body,_=f.rendered_floor_context(page)
                floor,evidence,mode=f.find_floor(focused,body,official)
                yc=f.official_case_id(body) or f.official_case_id(official)
                row.update({'http':r.status if r else None,'floor':floor,'subjects':sorted(f.subject_floors(floor)),'officialCaseId':yc,'mode':mode,'evidence':evidence,'title':page.title()})
              except Exception as exc:
                row['error']=f'{type(exc).__name__}: {str(exc)[:300]}'
              results.append(row)
            b.close()
          out={'verifiedAt':datetime.now(timezone.utc).isoformat(timespec='seconds'),'cases':cases,'results':results}
          Path('docs/preview/yungching-floor-regression.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - if: always()
        continue-on-error: true
        run: sudo wg-quick down surfshark || true
      - name: Save regression diagnostic
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/preview/yungching-floor-regression.json /tmp/regression.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/regression.json docs/preview/yungching-floor-regression.json
          git add docs/preview/yungching-floor-regression.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Yongching floor regression diagnostic"
          git push origin HEAD:main
      - name: Assert regression cases
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('docs/preview/yungching-floor-regression.json').read_text(encoding='utf-8'))
          rows={r['id']:r for r in x.get('results') or []}
          a=rows.get('6935425') or {}; b=rows.get('6857079') or {}; c=rows.get('6693666') or {}
          assert a.get('http')==200 and a.get('floor')=='3/14樓' and a.get('officialCaseId')=='YC1239410', a
          assert b.get('http')==200 and 1 in (b.get('subjects') or []), b
          assert c.get('http')==200 and 3 in (c.get('subjects') or []), c
          print('Yongching floor regression passed')
          PY
