name: 回復穩定手機圖示

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/revert-ios-stable.yml"

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Restore last known working iPhone icon setup
        shell: bash
        run: |
          git checkout 32b93f8a8ffebcd34c63f7147f92e514f7b66476 -- docs/index.html docs/icon-safe-180.png docs/icon-safe-32.png docs/apple-touch-icon.png docs/favicon.ico
      - name: Save stable setup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/icon-safe-180.png docs/icon-safe-32.png docs/apple-touch-icon.png docs/favicon.ico
          git diff --cached --quiet || git commit -m "Revert iPhone icon to stable working setup"
          git pull --rebase
          git push
